<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Apex Fortress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#04061a;--card:#080d28;--bd:#2a3556;--tx:#eef1ff;--sub:#9aa5c8;--in:#10163a;--pri:#8a3d14;--pri2:#c9651f;--btn:#1b2447}
  body.light{--bg:#eef2fb;--card:#fff;--bd:#c9d2ea;--tx:#1a2140;--sub:#5a6485;--in:#f3f6fd;--pri:#e8873a;--pri2:#f5a25d;--btn:#e3e9f8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}
  .card{width:calc(100% - 32px);max-width:480px;margin:28px 16px;padding:22px;border:2px solid var(--bd);border-radius:32px;background:var(--card);position:relative}
  h1{text-align:center;margin:8px 0 4px;font-size:30px}
  h2{margin:4px 0 8px}
  h3{margin:18px 0 8px;font-size:16px}
  .sub{text-align:center;color:var(--sub);margin:0 0 6px}
  .logo{width:84px;height:84px;margin:14px auto 0;border-radius:24px;border:2px solid var(--pri2);background:var(--in);display:flex;align-items:center;justify-content:center;font-size:44px}
  .chip{position:absolute;top:18px;right:18px;background:var(--btn);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:14px}
  input,select{font-size:16px;padding:13px;border-radius:16px;border:2px solid var(--bd);background:var(--in);color:var(--tx);width:100%;min-width:0}
  .mono{font-family:monospace;font-size:14px}
  .row{display:flex;gap:10px;align-items:stretch}
  button{font-size:16px;border:0;border-radius:16px;color:var(--tx);background:var(--btn);padding:12px 16px;white-space:nowrap}
  button.pri{background:var(--pri);color:#fff;font-weight:bold}
  button.dan{background:#a33;color:#fff}
  button:disabled{opacity:.45}
  button.sel{background:var(--pri);color:#fff;font-weight:bold;outline:2px solid var(--pri2)}
  #conn{margin:6px 2px;font-size:13px;color:var(--sub)}
  #msg{color:#fc6;min-height:20px;margin-top:6px}
  /* ---------- 대기실: 1280×720 무대를 화면 크기에 맞춰 키워요 ---------- */
  #room{position:fixed;inset:0;background:#060a1e;overflow:hidden}
  #room[hidden]{display:none}
  #lobby{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:20px;
    background:radial-gradient(900px 500px at 15% -10%,#16205a 0%,rgba(22,32,90,0) 70%),radial-gradient(700px 500px at 100% 100%,#2a1050 0%,rgba(42,16,80,0) 70%),#060a1e;
    color:#eaf0ff;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;overflow:hidden}
  :where(#lobby) button{font:inherit;padding:0;border:0;border-radius:0;background:none;color:inherit;white-space:normal;cursor:pointer}
  :where(#lobby) button:disabled{cursor:not-allowed}
  #lobby .cp{font-family:'Chakra Petch','Noto Sans KR',sans-serif}
  #lobby .bar{width:4px;height:18px;border-radius:2px;flex:none}
  #lobby .sec{font-size:20px;font-weight:900}
  #lobby .ro{pointer-events:none}
  #lobby .tk{box-sizing:border-box;height:84px;padding:6px 4px 8px;border-radius:14px;border:2px solid #2a3556;background:#0d1433;color:#eaf0ff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
  #lobby .mp{box-sizing:border-box;padding:4px 4px 8px;border-radius:14px;border:2px solid #2a3556;background:#0d1433;color:#eaf0ff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
  #lobby .mp canvas{display:block;width:100%;height:auto;border-radius:9px}
  #start{height:64px;padding:0 56px 0 44px;display:flex;align-items:center;gap:14px;border-radius:20px;background:linear-gradient(180deg,#7dffc4,#2fd48b);color:#04210f;font-size:24px;font-weight:900;letter-spacing:.06em;box-shadow:0 8px 30px rgba(93,255,176,.35),inset 0 1px 0 rgba(255,255,255,.7)}
  #start:disabled{opacity:.4;filter:grayscale(.8);box-shadow:none}
  #start[hidden],#vs[hidden]{display:none !important}
  /* ---------- 게임 화면 (항상 가로) ---------- */
  #game{position:fixed;inset:0;background:#05060f;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;--ch:100vh}
  /* 전체화면/방향 잠금이 안 되는 터치 기기(iOS 등)에서 세로로 들고 있으면 화면을 90° 돌려서 가로로 보여줘요 */
  #game.force-land{inset:auto;top:0;left:0;width:var(--sh);height:var(--sw);transform-origin:0 0;transform:translateX(var(--sw)) rotate(90deg)}
  #c{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #info{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#050a08ee;border:1px solid #00bf63;box-shadow:0 0 10px #00bf6366,0 3px 10px #0008;color:#fff;padding:6px 16px;border-radius:14px;font-size:15px;font-weight:bold;white-space:nowrap;z-index:5}

  #wind{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#050a08ee;border:1px solid #00bf63;box-shadow:0 0 8px #00bf6355;color:#d8ffe9;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:bold;white-space:nowrap;z-index:5;pointer-events:none}

  /* 컨트롤 크기는 화면 높이에 맞춰 자동 조절 */
  #game{--g:#00bf63;--gl:#4dffa8;--bk:#050a08}
  .pad,#fire,#fuel,#rd,#pw{--s:clamp(96px,calc(var(--ch) * .36),150px);--hh:clamp(66px,calc(var(--ch) * .22),96px);--mw:calc(var(--hh) * 2.3);--aw:calc(var(--s) * 1.15);--fw:calc(var(--s) * .74);--m:max(14px,env(safe-area-inset-left,0px));--b:max(14px,env(safe-area-inset-bottom,0px));--bw:6px}

  /* ---------- 조이스틱: 유리(글래스) 패널 + 민트 포인트 ---------- */
  #game{--ac:#5dffb0;--ac2:#b9ffdf;--neon:#4dd2ff;--glass:rgba(12,20,17,.62);--line:rgba(255,255,255,.16)}
  .glass{position:absolute;inset:0;pointer-events:none;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03) 45%,rgba(0,0,0,.16)),var(--glass);
    border:1px solid rgba(77,210,255,.42);
    box-shadow:0 10px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 0 12px rgba(77,210,255,.1);
    transition:box-shadow .18s,border-color .18s}
  .glass::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;   /* 바깥으로 번지는 하늘색 네온: 투명도만 천천히 숨 쉬어요 */
    box-shadow:0 0 0 1px rgba(77,210,255,.3),0 0 10px rgba(77,210,255,.4),0 0 26px rgba(77,210,255,.2);
    opacity:.8;transition:opacity .18s}
  .pad.on .glass,#pw.on .glass{border-color:rgba(130,225,255,.8);
    box-shadow:0 10px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 16px rgba(77,210,255,.2)}
  .pad.on .glass::after,#pw.on .glass::after{opacity:1;animation:none;
    box-shadow:0 0 0 1px rgba(130,225,255,.55),0 0 16px rgba(77,210,255,.65),0 0 40px rgba(77,210,255,.35)}
  @keyframes neonb{0%,100%{opacity:.6}50%{opacity:1}}
  #am .glass{inset:0 6.7%}   /* 조준: 높이만큼의 정원 (폭 × √3/2) */
  #mv .glass::before{content:"";position:absolute;left:22%;right:22%;top:50%;border-top:2px dotted rgba(255,255,255,.14)}

  .pad{position:absolute;bottom:var(--b);touch-action:none;z-index:5}
  .pad::after,#pw::after{content:attr(data-l);position:absolute;top:-27px;left:50%;transform:translateX(-50%);padding:3px 12px;border-radius:999px;
    background:var(--glass);border:1px solid rgba(77,210,255,.32);box-shadow:0 0 10px rgba(77,210,255,.18);
    color:#e9fff4;font-size:11px;font-weight:600;letter-spacing:.14em;white-space:nowrap;pointer-events:none}
  #mv{left:var(--m);width:var(--mw);height:var(--hh);--k:calc(var(--hh) * .62)}
  #am{right:var(--m);width:var(--aw);height:calc(var(--aw) * .866);--k:calc(var(--aw) * .2)}  /* 정육각형 비율 그대로: 높이 = 폭 × √3/2 */
  #am::after{top:auto;bottom:12%;padding:0;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:10px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.32em}

  /* 연료: 이동 패널 아래쪽의 가는 게이지 (노브가 움직이는 범위와 같은 길이) */
  .fuelsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 4px rgba(93,255,176,.45))}
  .fuelsvg .ftrack{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4;stroke-linecap:round}
  .fuelsvg #fuelf{fill:none;stroke-width:4;stroke-linecap:round;transition:opacity .15s}
  .fuelsvg.low #fuelf{stroke:#ff5a3c}
  .fuelsvg.low{filter:drop-shadow(0 0 5px rgba(255,90,60,.7))}

  /* 이동: 얇은 화살표 + 좌우로 미끄러지는 노브 */
  .ar{position:absolute;top:50%;width:calc(var(--hh) * .13);height:calc(var(--hh) * .13);margin-top:calc(var(--hh) * -.065);
    border:solid rgba(255,255,255,.5);border-width:0 0 2.5px 2.5px;pointer-events:none}
  .ar.l{left:12%;transform:rotate(45deg)}
  .ar.r{right:12%;transform:rotate(-135deg)}
  .knob{position:absolute;left:50%;top:50%;width:var(--k);height:var(--k);margin:calc(var(--k) / -2);border-radius:50%;pointer-events:none;
    background:linear-gradient(150deg,#fff,#dbe6e0 55%,#aebdb6);
    box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.14),inset 0 1px 0 #fff;
    transition:box-shadow .18s}
  .knob::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
  .knob.snap{transition:transform .16s ease-out,box-shadow .18s}
  .pad.on .knob{box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 0 5px rgba(93,255,176,.22),0 0 22px rgba(93,255,176,.5),inset 0 1px 0 #fff}

  /* 조준: 눈금 다이얼 + 중심에서 노브까지 이어지는 빛줄기 */
  .arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .arc .orbit{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.1}
  .arc .ticks{fill:none;stroke:rgba(255,255,255,.38);stroke-width:.9;stroke-linecap:round}
  .arc .dot{fill:rgba(255,255,255,.55)}
  .beam{position:absolute;left:50%;top:50%;height:2px;margin-top:-1px;width:0;transform-origin:0 50%;border-radius:2px;pointer-events:none;
    background:linear-gradient(90deg,rgba(93,255,176,0),rgba(93,255,176,.95));box-shadow:0 0 8px rgba(93,255,176,.6)}
  #am .knob{background:linear-gradient(150deg,#e9fff4,var(--ac) 55%,#1fbf7d);box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 14px rgba(93,255,176,.45),inset 0 1px 0 rgba(255,255,255,.8)}
  #am .knob::after{background:#fff;box-shadow:none}
  #am.on .knob{box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 0 5px rgba(93,255,176,.22),0 0 24px rgba(93,255,176,.65),inset 0 1px 0 rgba(255,255,255,.8)}

  /* ---------- 파워: 알약형 슬라이더 (초록 → 노랑 → 주황으로 차올라요) ---------- */
  #pw{--ph:clamp(40px,calc(var(--aw) * .3),56px);--th:calc(var(--ph) * .58);
    position:absolute;right:var(--m);width:var(--aw);height:var(--ph);bottom:calc(var(--b) + var(--aw) * .866 + 12px);z-index:5;touch-action:none}
  .pw-inner{position:absolute;inset:0 calc(var(--ph) * .42);pointer-events:none}   /* 이 영역이 0~100% 터치 범위 */
  .pw-track{position:absolute;left:0;right:0;top:50%;height:calc(var(--ph) * .26);transform:translateY(-50%);border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  .pw-fill{position:absolute;inset:0;background:linear-gradient(90deg,#7dffb5 0,#ffe66d 50%,#ff9f43 80%,#ff5e62 100%);clip-path:inset(0 50% 0 0)}
  .pw-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 calc(10% - 1.5px),rgba(0,0,0,.35) calc(10% - 1.5px) 10%)}
  .pw-mark{position:absolute;top:50%;left:50%;width:var(--th);height:var(--th);margin:calc(var(--th) / -2) 0 0 calc(var(--th) / -2);border-radius:50%;
    background:linear-gradient(150deg,#fff,#e1e9e4);box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 0 3px rgba(255,214,102,.3),inset 0 1px 0 #fff}
  .pw-mark::after{content:"";position:absolute;inset:32%;border-radius:50%;background:#ff9f43;box-shadow:0 0 8px #ff9f43}
  #pw.on .pw-mark{box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 0 5px rgba(255,214,102,.3),0 0 18px rgba(255,159,67,.6),inset 0 1px 0 #fff}

  /* ---------- 발사 버튼: 유리 원 + 퍼져나가는 링 ---------- */
  #fire{position:absolute;right:calc(var(--m) + var(--aw) + 22px);bottom:calc(var(--b) + 6px);width:var(--fw);height:var(--fw);padding:0;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ac2);touch-action:none;z-index:5;
    border:1.5px solid rgba(77,210,255,.6);
    background:radial-gradient(circle at 50% 28%,rgba(93,255,176,.32) 0,rgba(12,22,18,.6) 62%,rgba(6,12,10,.72) 100%);
    box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 12px rgba(77,210,255,.45),0 0 30px rgba(77,210,255,.2),inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 18px rgba(93,255,176,.14);
    transition:transform .08s,background .12s,box-shadow .12s,color .12s}
  #fire::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--neon);opacity:0;pointer-events:none}
  #fire .fi{width:34%;height:auto;filter:drop-shadow(0 0 5px var(--ac))}
  #fire b{font-size:clamp(13px,calc(var(--ch) * .04),19px);letter-spacing:.2em;font-weight:700;text-shadow:0 0 8px rgba(93,255,176,.7)}
  #fire:active:not(:disabled){transform:scale(.94);color:#05241a;
    background:radial-gradient(circle at 50% 28%,#c8ffe4 0,var(--ac) 65%,#1fbf7d 100%);
    box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 34px rgba(93,255,176,.6),0 0 22px rgba(77,210,255,.6),inset 0 1px 0 rgba(255,255,255,.6)}
  #fire:active:not(:disabled) .fi,#fire:active:not(:disabled) b{filter:none;text-shadow:none}
  #fire:disabled{filter:grayscale(.85) brightness(.6)}
  #fire:disabled::before{animation:none}
  @keyframes fring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.3);opacity:0}}
  @media (max-width:640px){#fire{right:calc(var(--m) + var(--aw) + 10px)}}

  /* ---------- 상태 표시 ---------- */
  #rd{position:absolute;right:var(--m);top:8px;color:#d8ffe9;background:#050a08ee;border:1px solid var(--g);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:bold;z-index:5;box-shadow:0 0 8px #00bf6355}
  /* ---------- 시작 연출: 로딩 화면 → 문이 열리며 전장이 나타나요 ---------- */
  #intro{position:absolute;inset:0;z-index:30;overflow:hidden;pointer-events:auto}
  #intro[hidden]{display:none}
  #intro .half{position:absolute;left:0;right:0;height:50.5%;background:radial-gradient(900px 400px at 50% 100%,#1b2a6b 0%,rgba(27,42,107,0) 70%),#05081c;transition:transform .85s cubic-bezier(.77,0,.18,1)}
  #intro .half.t{top:0;border-bottom:2px solid #4dd2ff;box-shadow:0 6px 30px rgba(77,210,255,.55)}
  #intro .half.b{bottom:0;background:radial-gradient(900px 400px at 50% 0%,#2a1060 0%,rgba(42,16,96,0) 70%),#05081c;border-top:2px solid #4dd2ff;box-shadow:0 -6px 30px rgba(77,210,255,.55)}
  #intro.open .half.t{transform:translateY(-102%)}
  #intro.open .half.b{transform:translateY(102%)}
  #intro .core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#eaf0ff;font-family:'Noto Sans KR',system-ui,sans-serif;text-align:center;transition:opacity .4s,transform .6s}
  #intro.open .core{opacity:0;transform:scale(1.35)}
  #intro .logo2{width:92px;height:92px;border-radius:26px;border:2px solid #4dd2ff;background:#0d1433;display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 0 30px rgba(77,210,255,.6);animation:inpulse 1s ease-in-out infinite}
  #intro .ttl{font:700 clamp(26px,6vh,44px)/1 'Chakra Petch','Noto Sans KR',sans-serif;letter-spacing:.2em;text-shadow:0 0 18px rgba(77,210,255,.7);padding-left:.2em}
  #intro .isub{font-size:clamp(13px,2.6vh,17px);color:#a9b8de;min-height:1.4em}
  #intro .ibar{width:min(340px,60vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  #intro .ibar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4dd2ff,#5dffb0,#ffe94a);box-shadow:0 0 12px #5dffb0}
  #intro.load .ibar i{animation:infill 1.85s cubic-bezier(.45,.05,.3,1) forwards}
  #intro .tip{font-size:clamp(11px,2.2vh,14px);color:#7f8db8;margin-top:6px;max-width:80vw}
  @keyframes infill{0%{width:0}35%{width:42%}60%{width:58%}100%{width:100%}}
  @keyframes inpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #c.zoomin{animation:czoom 1.3s cubic-bezier(.2,.7,.2,1) both}
  @keyframes czoom{0%{transform:scale(1.22);filter:brightness(2.2) blur(3px)}100%{transform:scale(1);filter:none}}
  /* 가운데 큰 안내 문구 / 순서 결과 카드 / 순서 표시 */
  #banner{position:absolute;left:0;right:0;top:24%;z-index:12;text-align:center;pointer-events:none;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;opacity:0}
  #banner b{display:block;font:700 clamp(28px,8vh,60px)/1.1 'Chakra Petch','Noto Sans KR',sans-serif;letter-spacing:.08em;text-shadow:0 0 24px rgba(255,233,74,.8),0 4px 12px #000}
  #banner span{display:block;margin-top:8px;font-size:clamp(13px,3vh,20px);text-shadow:0 2px 8px #000;color:#d8ffe9}
  #banner.on{animation:banin 2.2s ease both}
  @keyframes banin{0%{opacity:0;transform:scale(1.7)}14%{opacity:1;transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.96) translateY(-10px)}}
  #rank{position:absolute;left:50%;top:15%;transform:translateX(-50%);z-index:12;min-width:min(380px,70vw);padding:14px 20px 16px;border-radius:22px;background:rgba(5,10,24,.9);border:2px solid #ffe94a;box-shadow:0 0 30px rgba(255,233,74,.35),0 10px 30px #000a;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;pointer-events:none}
  #rank[hidden]{display:none}
  #rank h4{margin:0 0 8px;text-align:center;font-size:clamp(16px,3.6vh,24px);color:#ffe94a;letter-spacing:.05em}
  #rank .rw{display:flex;align-items:center;gap:10px;padding:6px 10px;margin-top:6px;border-radius:12px;background:rgba(255,255,255,.07);border-left:6px solid var(--c);font-size:clamp(13px,3vh,19px);font-weight:700;opacity:0;animation:rwin .45s ease forwards;animation-delay:calc(var(--n) * .28s)}

</head>
<body>

<div id="game" hidden>

  <div id="wind"><svg id="wsv" viewBox="-60 -12 120 24" width="84" height="17"><g id="wg"><line id="wln" x1="-40" y1="0" x2="34" y2="0" stroke="#4dffa8" stroke-width="5" stroke-linecap="round"/><polygon id="wpo" points="26,-8 44,0 26,8" fill="#4dffa8"/></g></svg><b id="wt"></b></div>
  <div id="mv" class="pad" data-l="이동"><div class="glass"></div><svg id="fuelsvg" class="fuelsvg" viewBox="0 0 230 100" preserveAspectRatio="none"><defs><linearGradient id="fg" gradientUnits="userSpaceOnUse" x1="58" y1="0" x2="172" y2="0"><stop offset="0" stop-color="#d9ff3d"/><stop offset="1" stop-color="#2ff0a0"/></linearGradient></defs><path class="ftrack" d="M 58 90 L 172 90" pathLength="100"/><path id="fuelf" d="M 58 90 L 172 90" pathLength="100" stroke="url(#fg)" stroke-dasharray="0 100"/></svg><i class="ar l"></i><i class="ar r"></i><div class="knob"></div></div>
  <div id="rd"></div>
  <div id="am" class="pad" data-l="조준"><div class="glass"></div><svg class="arc" viewBox="-50 -43.3 100 86.6"><path class="orbit" d="M -27 0 A 27 27 0 0 1 27 0"/><path class="ticks" d="M37.60 -0.00L41.40 -0.00M37.48 -10.04L39.02 -10.46M33.60 -19.40L34.99 -20.20M27.44 -27.44L28.57 -28.57M19.40 -33.60L20.20 -34.99M10.04 -37.48L10.46 -39.02M0.00 -37.60L0.00 -41.40M-10.04 -37.48L-10.46 -39.02M-19.40 -33.60L-20.20 -34.99M-27.44 -27.44L-28.57 -28.57M-33.60 -19.40L-34.99 -20.20M-37.48 -10.04L-39.02 -10.46M-37.60 -0.00L-41.40 -0.00"/><circle class="dot" r="1.8"/></svg><i id="beam" class="beam"></i><div class="knob"></div></div>
  <button id="fire"><svg class="fi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg><b>발사</b></button>
  <div id="pw" data-l="파워 50"><div class="glass"></div><div class="pw-inner"><div class="pw-track"><div class="pw-fill" id="pwf"></div></div><div class="pw-mark" id="pwm"></div></div></div>

    <div class="core"><div class="logo2">💥</div><div class="ttl">APEX FORTRESS</div><div class="isub" id="isub"></div><div class="ibar"><i></i></div><div class="tip" id="itip"></div></div></div>

<script src="maps.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), W = FMAP.W, H = FMAP.H, K = FMAP.K, TS = FMAP.TS, Z = 1.6, TGS = 1.9, VW = 2000, VH = 1200, MPP = 10;   // VW×VH: 카메라가 비추는 월드 범위, MPP: 1m = 10px
const COLORS = ['#3d8bff', '#ff3b5c', '#2fe86a', '#ffb41f'];   // 네온 배경에서 잘 보이는 밝은 색
const ICONS = [['🪖', '탱크'], ['🐸', '개구리'], ['🚀', '우주선'], ['🐱', '고양이'], ['🤖', '로봇'], ['🦖', '공룡']];
const MAPS = FMAP.MAPS, RANDOM = MAPS.length;
let ws = null, wsUrl = '', pending = null, retry = null;
let me = -1, st = null, anim = null, boom = null, fresh = true, rooms = [];
const aims = [90, 90, 90, 90], my = { angle: 90, power: 50 };
const TEAMC = ['#3d8bff', '#ff3b5c'], TEAMN = ['A팀', 'B팀'];   // 팀전에서는 팀 색으로 통일해요
const pc = i => (st && st.mode === 'team' && st.teams && st.teams[i] != null ? TEAMC[st.teams[i]] : COLORS[i]);
const TANKS = [['basic', '기본탄', '균형 잡힌 포탄 · 정통으로 6발 맞으면 파괴'], ['incendiary', '소이탄', '착탄 지점이 3초간 불타요 · 불 위의 탱크는 0.5초마다 2 피해'], ['cluster', '집속탄', '작은 포탄 8발을 한 번에 · 흩어져 날아가요'], ['homing', '유도탄', '가까운 적을 추적 · 30% 불발 · 약한 피해'], ['heavy', '광폭탄', '크고 무거운 포탄 · 느리고 사거리 70% · 피해 2배 · 폭발 면적 3배'], ['pierce', '관통탄', '뾰족한 탄이 땅을 뚫고 날아가 바로 공격 · 피해는 기본탄보다 약간 약함 · 피격 범위가 넓어요'], ['laser', '레이저', '직선으로 날아가며 벽·맵 경계에 4번 반사 · 파워 무관 · 피해 22 · 판정이 넓어요 · 화면을 드래그해 적을 찾을 수 있어요'], ['carpet', '융단 폭격', '가벼운 신호탄을 던져요(피해 없음) · 땅에서 조금 구르며 붉은 연기와 빛이 피어나고 · 잠시 뒤 위에서 미사일 3발이 수직으로 떨어져요 · 미사일 1발당 정통 20 · 스치면 13 피해'], ['bumper', '범퍼', '탱탱볼처럼 2번 튀며 좌우로 2개씩 쪼개져요 · 직격 20 · 한 번 튄 탄 12 · 가장 작은 탄 8']];
const TN = Object.fromEntries(TANKS.map(t => [t[0], t[1]]));

const ls = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
function el(tag, text, parent, css) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (css) e.style.cssText = css;
  parent.appendChild(e);
  return e;
}
function show(v) {
  const was = !$('game').hidden;
  ['menu', 'room', 'game'].forEach(x => { $(x).hidden = x !== v; });
  fitLobby();
  if (was && v !== 'game') exitFS();
}
const sendMsg = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

// ---------- 테마 / 입력 초기값 ----------
function setTheme(light) {
  document.body.classList.toggle('light', light);
  $('theme').textContent = light ? '🌙 다크' : '☀️ 라이트';
  ls.set('theme', light ? 'light' : 'dark');
}
$('theme').onclick = () => setTheme(!document.body.classList.contains('light'));
setTheme(ls.get('theme') === 'light');

ICONS.forEach(([e, n]) => { const o = el('option', `${e} ${n}`, $('icon')); o.value = e; });
$('name').value = ls.get('nick') || '여행자';
$('icon').value = ls.get('icon') || ICONS[0][0];
$('url').value = ls.get('url') || (location.protocol.startsWith('http') ? location.origin : '');
const profile = () => {
  const name = $('name').value.trim() || '여행자';
  ls.set('nick', name); ls.set('icon', $('icon').value);
  return { name, icon: $('icon').value };
};

// ---------- 서버 연결 ----------
function toWs(u) {
  u = u.trim().replace(/\/+$/, '');
  if (!u) return '';
  if (/^wss?:\/\//.test(u)) return u;
  if (/^https?:\/\//.test(u)) return u.replace(/^http/, 'ws');
  return (/^(localhost|127\.|192\.168\.)/.test(u) ? 'ws://' : 'wss://') + u;
}
function setConn(level, text) { $('conn').textContent = ['🔴 ', '🟡 ', '🟢 '][level] + text; }

function connect() {
  clearTimeout(retry);
  const u = toWs($('url').value);
  if (!u) { setConn(0, '서버 URL을 입력해 주세요'); return; }
  wsUrl = u; ls.set('url', $('url').value.trim());
  if (ws) { ws.onclose = null; ws.close(); }
  setConn(1, '연결 중... (Render 무료 서버는 깨어나는 데 최대 1분 걸려요)');
  let s;
  try { s = new WebSocket(u); } catch (e) { setConn(0, '올바르지 않은 주소예요'); return; }
  ws = s;
  s.onopen = () => {
    if (ws !== s) return;
    setConn(2, '서버에 연결됨'); $('msg').textContent = '';
    if (pending) { const p = pending; pending = null; sendMsg(p); }
  };
  s.onmessage = e => { if (ws === s) onMsg(JSON.parse(e.data)); };
  s.onclose = () => {
    if (ws !== s) return;
    ws = null; show('menu'); me = -1; st = null; anim = null;
    setConn(0, '연결이 끊겼어요. 다시 연결하는 중...');
    retry = setTimeout(connect, 2500);
  };
}
function act(m) {
  if (toWs($('url').value) !== wsUrl || !ws || ws.readyState > 1) { pending = m; connect(); $('msg').textContent = '서버에 연결하는 중이에요...'; return; }
  if (ws.readyState === 0) { pending = m; $('msg').textContent = '서버에 연결하는 중이에요...'; return; }
  sendMsg(m);
}
$('url').onchange = connect;

function onMsg(m) {
  if (m.type === 'rooms') { rooms = m.rooms; renderRooms(); }
  else if (m.type === 'joined') me = m.you;
  else if (m.type === 'error') { $('msg').textContent = m.msg; $('rmsg').textContent = m.msg; }
  else if (m.type === 'room' || m.type === 'state') { if (anim) anim.pending = m; else apply(m); }
  else if (m.type === 'moved') {
    const t = anim ? anim.pending : st;
    if (t && t.players) { const p = t.players[m.i]; p.x = m.x; p.y = m.y; t.fuel = m.fuel; }
    ui();
  }
  else if (m.type === 'turn') {   // 포탄이 끝나서 차례가 넘어갔어요 (애니메이션 중이면 끝난 뒤 적용될 상태에 반영)
    const t = anim ? anim.pending : st;
    if (t && t.players) { t.turn = m.turn; t.wind = m.wind; t.fuel = m.fuel; t.busy = false; }
    hideRank();
    ui();
  }
  else if (m.type === 'burn') {   // 불길 틱: 체력/불길 갱신 (애니메이션 중이면 끝난 뒤 적용될 상태에 반영)
    const t = anim ? anim.pending : st;
    if (t && t.players) {
      if (!anim) m.hp.forEach((h, i) => { const p = t.players[i]; if (p && p.on && h < p.hp) FX.floats.push({ x: p.x, y: p.y - 120, t: 0, txt: '-' + (p.hp - h), big: false }); });
      m.hp.forEach((h, i) => { if (t.players[i]) t.players[i].hp = h; });
      t.fires = m.fires; const now = performance.now(); t.fires.forEach(f => { f.at = now; });
    }
    ui();
  }
  else if (m.type === 'ofired') {   // 누군가 조준을 확정했어요
    const t = anim ? anim.pending : st;
    if (t && t.ofired) t.ofired[m.i] = true;
    ui();
  }
  else if (m.type === 'oshot') {   // 순서 정하기: 모두의 포탄이 동시에 날아가요
    m.shots.forEach(sh => { aims[sh.by] = sh.angle; fireFx(sh.by, sh.angle); });
    setOrderMarks(m.shots);
    if (!m.shots.length) { fxFromDiff(st, m.state); apply(m.state); showRank(m.ranks); }
    else anim = { order: true, ranks: m.ranks, shells: m.shots.map(s => ({ path: s.path, impact: s.impact, by: s.by, boomed: false })), i: 0, pending: m.state, by: -1, kind: 'basic', dud: false };
    ui();
  }
  else if (m.type === 'shot') { aims[m.by] = m.angle; fireFx(m.by, m.angle); anim = { shells: m.shells.map(s => ({ path: s.path, impact: s.impact, boomed: false, gen: s.gen || 0, splits: s.splits || [] })), i: 0, pending: m.state, by: m.by, kind: m.kind, dud: m.dud, carpet: m.carpet }; ui(); }
}

// ---------- 메뉴 ----------
$('create').onclick = () => act({ type: 'create', ...profile() });
$('join').onclick = () => joinRoom($('code').value);
function joinRoom(code) { $('msg').textContent = ''; act({ type: 'join', code, ...profile() }); }

function renderRooms() {
  const box = $('rooms'); box.textContent = '';
  if (!rooms.length) el('div', '열린 방이 없어요. 방을 만들어 보세요.', box, 'color:var(--sub)');
  rooms.forEach(r => {
    const label = `${r.code} · ${r.host}의 방 · ${r.count}/4 · ${r.mode === 'team' ? '팀전' : '개인전'} · ${r.map === RANDOM ? '랜덤' : MAPS[r.map].name}${r.playing ? ' (게임 중)' : ''}`;
    const b = el('button', label, box, 'display:block;margin:6px 0;width:100%;text-align:left');
    b.disabled = r.playing || r.count >= 4;
    b.onclick = () => joinRoom(r.code);
  });
}

// ---------- 대기실 ----------
function preview(c, id) {

// 지형·배경 캐시의 최대 배율: 큰 화면에서 흐려 보이지 않도록 기기에 맞춰 올려요 (캐시 = 월드 5000×1500 × 배율²)
//  - 터치 기기: 1 (모바일 브라우저는 캔버스 면적 제한이 작아요)  - 데스크톱: 1.5  - 메모리 8GB 이상 데스크톱: 2

  if (matchMedia('(pointer:coarse)').matches) return 1;
  return 1.25;
}

function layout() {
  const w = innerWidth, h = innerHeight, g = $('game');
  const rot = matchMedia('(pointer:coarse)').matches && h > w;
  g.classList.toggle('force-land', rot);
  g.style.setProperty('--sw', w + 'px');
  g.style.setProperty('--sh', h + 'px');
  g.style.setProperty('--ch', (rot ? w : h) + 'px');
  const fit = Math.min((rot ? h : w) / VW, (rot ? w : h) / VH);
  const raw = Math.min(2.5, Math.max(.5, Math.round(fit * (devicePixelRatio || 1) * 4) / 4)), nv = Math.min(QCAP, raw), ns = Math.min(sceneCap(), raw);
  if (nv !== SV || cv.width !== Math.round(VW * nv)) { SV = nv; cv.width = Math.round(VW * SV); cv.height = Math.round(VH * SV); }   // 화면 캔버스 = 카메라가 비추는 범위
  if (ns !== S || sceneCv.width !== Math.round(W * ns)) {   // 월드 전체를 한 번 그려 두는 캐시 (메모리 때문에 배율 최대 1)
    S = ns; sceneCv.width = Math.round(W * S); sceneCv.height = Math.round(H * S); sceneKey = null;

}

// ---------- 조이스틱 (이동 / 조준 분리) ----------
function makePad(pad, onMove, resetOnEnd, opts = {}) {
  const knob = pad.querySelector('.knob'); let drag = false;
  const upd = e => {
    const r = pad.getBoundingClientRect(), Rm = opts.rm ? opts.rm(pad) : pad.offsetWidth / 2 * 0.7;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if ($('game').classList.contains('force-land')) [dx, dy] = [dy, -dx]; // 90° 회전 보정
    if (opts.horiz) dy = 0;                                                // 이동 조이스틱은 좌우로만
    const h = Math.hypot(dx, dy), k = Math.min(h, Rm) / (h || 1);
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
    onMove(dx, dy, Rm, h);
  };
  pad.onpointerdown = e => { drag = true; pad.classList.add('on'); knob.classList.remove('snap'); pad.setPointerCapture(e.pointerId); upd(e); };
  pad.onpointermove = e => { if (drag) upd(e); };
  pad.onpointerup = pad.onpointercancel = () => {
    drag = false; pad.classList.remove('on');
    if (resetOnEnd) { knob.classList.add('snap'); knob.style.transform = ''; onMove(0, 0, 1, 0); }
  };
}

// 이동: 좌우로 밀면 이동 (턴마다 연료 한도 안에서)
let mvDir = 0;
makePad($('mv'), (dx, dy, Rm) => { mvDir = dx > Rm * 0.3 ? 1 : dx < -Rm * 0.3 ? -1 : 0; }, true, { horiz: true, rm: p => p.offsetHeight * 0.46 });
let kbDir = 0;   // 키보드 A/D 이동 방향
setInterval(() => { const d = mvDir || kbDir; if (d && canAct() && st.fuel > 0) sendMsg({ type: 'move', dir: d }); }, 40);

// 조준: 방향 = 각도(0~180°), 당긴 거리 = 파워. 놓아도 값은 유지돼요.
makePad($('am'), (dx, dy, Rm, h) => {   // 조준 조이스틱: 각도만 담당
  if (me < 0) return;
  if (h < Rm * 0.2) { placeAim(); return; }  // 중앙 근처는 무시
  let ang = Math.atan2(-dy, dx) * 180 / Math.PI;
  if (ang < 0) ang = dx >= 0 ? 0 : 180;
  my.angle = Math.round(ang);
  aims[me] = my.angle; placeAim(); ui();
}, false, { rm: p => p.offsetWidth * 0.27 });

// 파워 막대: 막대를 직접 터치/드래그해서 조절

(function () {

// 발사: 별도 버튼
$('fire').onclick = () => {

// ---------- 키보드 ----------
// A/D: 이동 · ←/→: 조준 각도 · W/S: 파워 · 스페이스: 발사
const keys = new Set();
function kbStep() {
  kbDir = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
  if (!st || st.type !== 'state' || me < 0 || $('game').hidden) return;
  const da = (keys.has('ArrowLeft') ? 1 : 0) - (keys.has('ArrowRight') ? 1 : 0);   // 0°=오른쪽, 180°=왼쪽
  if (da) { my.angle = Math.max(0, Math.min(180, my.angle + da)); aims[me] = my.angle; placeAim(); ui(); }
  const dp = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
  if (dp) setPower(my.power + dp);
}
setInterval(kbStep, 40);
const KB = ['KeyA', 'KeyD', 'KeyW', 'KeyS', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', e => {
  if ($('game').hidden || !KB.includes(e.code) || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  if (e.code === 'Space') { if (!e.repeat) $('fire').onclick(); return; }
  keys.add(e.code);
  if (!e.repeat) kbStep();   // 짧게 눌러도 한 칸은 움직이도록
});
addEventListener('keyup', e => { if (KB.includes(e.code)) { keys.delete(e.code); if (!$('game').hidden) e.preventDefault(); } kbDir = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0); });
addEventListener('blur', () => { keys.clear(); kbDir = 0; });

const seeded = s => () => (s = s * 16807 % 2147483647) / 2147483647;

const sceneCv = document.createElement('canvas'); sceneCv.width = W; sceneCv.height = H;
const bgCv = document.createElement('canvas');
let S = 1, SV = 1;   // 렌더 배율: 화면에 실제로 보이는 크기 × devicePixelRatio (선명도)
let sceneKey = null, bgKey = null, edgePath = null, twink = [], TC = null;
const FX = { booms: [], floats: [], muzzle: null, shake: 0, flash: 0 };
const cam = { x: 0, y: 0, snap: true };
let FS = 1;   // 이번 프레임이 60fps 프레임의 몇 배인지 (주사율이 달라도 같은 속도로 움직이게)
const vis = [], aimVis = [], pv = { a: 45, p: 50 };   // 탱크 화면 표시 위치 (서버 좌표를 부드럽게 따라가요)

// ----- 배경: 별 + 레트로 네온 태양 + 먼 능선 -----
function buildBg(th, id) {
  const W = 2000, H = 600;   // 배경은 2000×600 기준 좌표로 그리고 K배 확대해요
  bgCv.width = sceneCv.width; bgCv.height = sceneCv.height;
  const c = bgCv.getContext('2d'); c.setTransform(S * K, 0, 0, S * K, 0, 0);
  const rnd = seeded(777 + id * 131), T = tcol(th);
  const sky = c.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[1]);
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 240; i++) {
    const x = rnd() * W, y = rnd() * H * .7, r = .5 + rnd() * 1.2, a = .25 + rnd() * .6;
    c.fillStyle = rnd() < .3 ? hsl(T.h, 100, 80, a) : `rgba(255,255,255,${a})`; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();

  // 네온 태양: 위는 보색, 아래는 맵 색. 아래쪽엔 레트로 가로 줄무늬

  const s2 = sc.getContext('2d'); s2.setTransform(S * K, 0, 0, S * K, 0, 0);

  sg.addColorStop(0, hsl(T.h2, 100, 68)); sg.addColorStop(.55, hsl(T.h2 - 40, 100, 60)); sg.addColorStop(1, hsl(T.h, 100, 56));

  const ridge = (base, amp, fill, line) => {
    const ph = [rnd() * 6, rnd() * 6, rnd() * 6], p = new Path2D(), ys = []; p.moveTo(0, H);
    for (let x = 0; x <= W; x += 6) { const y = base - amp * (.55 + .3 * Math.sin(x / 150 + ph[0]) + .25 * Math.sin(x / 61 + ph[1]) + .12 * Math.sin(x / 23 + ph[2])); p.lineTo(x, y); ys.push(y); }
    p.lineTo(W, H); p.closePath(); c.fillStyle = fill; c.fill(p);
    c.lineWidth = 1.5; c.strokeStyle = line; c.beginPath(); ys.forEach((y, i) => i ? c.lineTo(i * 6, y) : c.moveTo(0, y)); c.stroke();

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
}

// ----- 지형: 빛나는 본체 + 안쪽 등고선 + 네온 튜브 같은 윗선 -----
// x0~x1(설계 좌표)만 지정하면 그 구간만 다시 그려요. (포탄이 땅을 파낼 때마다 전체를 다시 그리면 뚝 끊겨요)
let sceneT = null, sceneMap = -1, edgeChunks = [];
function buildScene(th, T, id, x0, x1) {
  const W = 2000, H = 600;   // 지형 장식은 2000×600 기준 좌표(edgePath도 이 좌표)로 그리고 K배 확대해요
  const c = sceneCv.getContext('2d'); TC = tcol(th);
  if (bgKey !== id + '@' + S) { buildBg(th, id); bgKey = id + '@' + S; }
  const part = x0 !== undefined;
  const PAD = 45, MG = 32;                                  // PAD: 다시 그릴 여유, MG: 경계에서 빛이 끊기지 않게 경로를 더 길게 잡는 길이
  const px0 = part ? Math.max(0, Math.floor(x0 - PAD)) : 0, px1 = part ? Math.min(W, Math.ceil(x1 + PAD)) : W;
  const q0 = Math.max(0, px0 - MG), q1 = Math.min(W - 1, px1 + MG);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;

  for (let x = q0; x <= q1; x++) { let s = 0, n = 0; const cx = Math.round(x * K); for (let k = -5; k <= 5; k++) { const i = cx + k; if (i >= 0 && i < T.length) { s += T[i]; n++; } } Y[x] = s / n / K; }
  const fillP = new Path2D(); fillP.moveTo(q0, H + 4); fillP.lineTo(q0, Y[q0]);

  const gf = c.createLinearGradient(0, 110, 0, H);

  c.save(); c.clip(fillP);
  c.globalCompositeOperation = 'lighter';
  [[26, .06], [12, .09]].forEach(([w, a]) => { c.lineWidth = w; c.strokeStyle = TC.lite(a); c.stroke(edge); });
  c.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 520; i++) {   // 반짝 점 (난수 호출 순서는 항상 같게 유지해야 부분 재생성해도 모양이 같아요)
    const x = Math.floor(rnd() * W), r1 = rnd(), r2 = rnd(), r3 = rnd(), r4 = rnd();
    if (x < q0 || x > q1) continue;

  c.restore();
  // 숨쉬는 지형 빛용 윗선: 화면에 보이는 조각만 그릴 수 있게 250칸씩 나눠 둬요 (전체 경로를 매 프레임 그리면 무거워요)
  edgeChunks = [];

      const yy = s2 / n / K; first ? e.moveTo(x, yy) : e.lineTo(x, yy); first = false;

}

// o: { col, lite, edge, dir(±1), a(조준 라디안), tilt, now, i }
function paintTank(kind, o) {
  o.k = TK[kind]; o.tp = TPK[kind];
  C.save(); C.rotate(o.tilt); C.lineJoin = 'round'; C.lineCap = 'round';
  C.save(); C.translate(8 * o.dir, -19.5); C.rotate(-o.a - o.tilt); if (o.dir < 0) C.scale(1, -1); BARREL[kind](o); C.restore();   // 포신 (왼쪽을 볼 땐 위아래를 다시 뒤집어 장식이 위에 오게)
  C.save(); C.scale(o.dir, 1); BODY[kind](o); C.restore();
  C.restore();
}

function drawTank(p, i, deg, active) {
  const kind = TK[p.tank] ? p.tank : 'basic', k = TK[kind];
  const col = pc(i), a = deg * Math.PI / 180, dir = deg <= 90 ? 1 : -1, T = st.terrain, now = performance.now();
  const x0 = Math.max(0, Math.round(p.x - 14 * TS)), x1 = Math.min(W - 1, Math.round(p.x + 14 * TS));
  const tilt = Math.max(-0.5, Math.min(0.5, Math.atan2(T[x1] - T[x0], x1 - x0)));

  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.scale(1, .26);   // 발밑 네온 빛
  const ug = ctx.createRadialGradient(0, 0, 0, 0, 0, 40); ug.addColorStop(0, rgba(col, .6)); ug.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = ug; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill();

    const u2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 30); u2.addColorStop(0, rgba(k.acc, .3)); u2.addColorStop(1, rgba(k.acc, 0));

  ctx.restore();
  paintTank(kind, { col, lite: shade(col, .6), edge: shade(col, .35), dir, a, tilt, now, i });
  ctx.restore();

  if (p.hp <= 35) {   // 다치면 연기, 많이 다치면 불꽃
    const t = now / 600;
    for (let n = 0; n < 3; n++) {
      const u = (t + n / 3) % 1;
      ctx.fillStyle = `rgba(70,74,92,${.55 * (1 - u)})`;
      ctx.beginPath(); ctx.arc(p.x - 4 * TS * dir + Math.sin(u * 6 + n) * 4 * TS, p.y - (24 + u * 20) * TS, (3 + u * 5) * TS, 0, 7); ctx.fill();
    }

      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let n = 0; n < 3; n++) { ctx.fillStyle = `rgba(255,${120 + Math.random() * 90 | 0},40,${.5 + Math.random() * .4})`; ctx.beginPath(); ctx.arc(p.x - 6 * TS * dir + (Math.random() - .5) * 8 * TS, p.y - (18 + Math.random() * 8) * TS, (.8 + Math.random() * 1.6) * TS, 0, 7); ctx.fill(); }
      ctx.restore();
    }
  }
}

// 대기실 탱크 선택 버튼용 작은 미리보기

// 이름표 + 4칸 체력바 + 내 차례 표시
function drawTag(p, i, active) {
  const col = pc(i), hp = Math.max(0, Math.min(100, p.hp)), x = 0, y = 0, now = performance.now();
  ctx.save(); ctx.translate(p.x, p.y - 36 * TS - 8 * TGS); ctx.scale(TGS, TGS);
  ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const label = `${st.mode === 'team' ? TEAMN[p.team][0] + ' ' : ''}${p.icon || ''} ${i === me ? '나' : p.name}`, w = Math.max(44, ctx.measureText(label).width + 16);
  rrect(x - w / 2, y - 17, w, 15, 7.5); ctx.fillStyle = 'rgba(4,6,16,.8)'; ctx.fill(); ctx.lineWidth = 1.3; ctx.strokeStyle = rgba(col, .95); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(label, x, y - 9);
  ctx.textBaseline = 'alphabetic';
  const seg = 4, gap = 2, sw = (w - gap * (seg - 1)) / seg, hc = hp > 60 ? '#3dff7a' : hp > 30 ? '#ffd23a' : '#ff4d4d';
  for (let k = 0; k < seg; k++) {
    const sx = x - w / 2 + k * (sw + gap), f = Math.max(0, Math.min(1, (hp - k * 25) / 25));
    rrect(sx, y + 1, sw, 4.5, 2); ctx.fillStyle = 'rgba(4,6,16,.8)'; ctx.fill();
    if (f > 0) { rrect(sx, y + 1, sw * f, 4.5, 2); ctx.fillStyle = hc; ctx.fill(); }
  }
  if (st.phase === 'order' && st.ofired && st.ofired[i]) {   // 순서 정하기: 조준 확정 표시
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    rrect(x - 25, y - 38, 50, 16, 8); ctx.fillStyle = 'rgba(30,200,110,.95)'; ctx.fill(); ctx.fillStyle = '#04210f'; ctx.fillText('✔ 확정', x, y - 30); ctx.textBaseline = 'alphabetic';
  }
  if (active) {   // 위아래로 흔들리는 빛나는 화살표
    const bob = Math.sin(now / 200) * 3, ay = y - 30 + bob;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(x, ay + 4, 0, x, ay + 4, 16); gg.addColorStop(0, rgba(col, .7)); gg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, ay + 4, 16, 0, 7); ctx.fill(); ctx.restore();
    ctx.fillStyle = shade(col, .55); ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x - 7, ay); ctx.lineTo(x + 7, ay); ctx.lineTo(x, ay + 10); ctx.closePath(); ctx.stroke(); ctx.fill();
  }
  ctx.restore();
}

// ----- 조준 점선 미리보기 (궤적 앞부분만, 서버와 같은 물리) -----
const _ds = {};
function dotSprite(col) {   // 점 주변 빛: 그라데이션을 점마다 만들지 않고 한 번만 그려 재사용
  if (_ds[col]) return _ds[col];
  const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, rgba(col, .8)); gr.addColorStop(1, rgba(col, 0)); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return (_ds[col] = c);
}
function drawPreview(p, col) {
  if (p.tank === 'laser') {   // 레이저는 직선: 첫 번째 벽까지만 점선으로 보여줘요 (파워 무관)
    const a = pv.a * Math.PI / 180, dx = Math.cos(a), dy = -Math.sin(a), T = st.terrain, LM = 900 * K / 2.5, GP = 13 * K;
    let x = p.x, y = T[Math.floor(p.x)] - 20 * TS, len = 0, next = 30 * K - GP + (performance.now() / 50) % GP;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    while (len < LM) {
      const x0 = x, y0 = y, l0 = len;
      x += dx * 4; y += dy * 4; len += 4;
      if (x < 0 || x >= W || y < 0 || y >= T[Math.floor(x)]) break;   // 지형·맵 경계 모두 '벽'
      while (len >= next) {   // 점은 걸음 끝이 아니라 정확한 거리 위치에 찍어야 흐를 때 덜덜거리지 않아요
        const f = (next - l0) / 4, qx = x0 + (x - x0) * f, qy = y0 + (y - y0) * f, nl = next; next += GP; if (nl < 30 * K) continue;
        const al = Math.max(.15, 1 - nl / LM);
        ctx.fillStyle = rgba(col, .8 * al); ctx.beginPath(); ctx.arc(qx, qy, 5 * Z, 0, 7); ctx.fill();
        ctx.fillStyle = `rgba(255,255,255,${al})`; ctx.beginPath(); ctx.arc(qx, qy, 1.8 * Z, 0, 7); ctx.fill();
      }
    }
    ctx.restore(); return;
  }
  const a = pv.a * Math.PI / 180, v = pv.p * 8 * K * (p.tank === 'heavy' ? Math.sqrt(.7) : 1), dt = 1 / 120;
  let x = p.x, y = st.terrain[Math.floor(p.x)] - 14 * TS, vx = v * Math.cos(a), vy = -v * Math.sin(a), len = 0;
  const LMAX = (60 + pv.p * 1.1) * K, START = 30 * K, GAP = 13 * K;
  let next = START - GAP + (performance.now() / 50) % GAP;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let t = 0; t < 1200 && len < LMAX; t++) {
    vx += st.wind * 3 * K * dt * (p.tank === 'carpet' ? 1.6 : 1); vy += 500 * K * dt;
    const nx = x + vx * dt, ny = y + vy * dt, l0 = len, sl = Math.hypot(nx - x, ny - y);
    len += sl;
    while (len >= next) {   // 점을 정확한 거리 위치에 찍어서 흐를 때 걸음 단위로 덜덜거리지 않게 해요
      const f = sl ? (next - l0) / sl : 0, qx = x + (nx - x) * f, qy = y + (ny - y) * f, nl = next; next += GAP;
      if (nl < START) continue;
      const al = Math.max(.12, 1 - (nl - START) / (LMAX - START) * .88);
      ctx.globalAlpha = al; ctx.drawImage(dotSprite(col), qx - 7 * Z, qy - 7 * Z, 14 * Z, 14 * Z);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(qx, qy, (1.6 + al * 1.4) * Z, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    x = nx; y = ny;
  }
  ctx.restore();
}

// ----- 포탄: 쏜 사람 색의 꼬리 + 하얀 심지 -----
// 레이저: 쏘는 순간 길게 뻗는 곧은 광선. 머리가 끝에 닿으면 전체가 한꺼번에 가늘어지며 사라져요.
// 굵기가 일정한 빔(바깥 후광 → 색 광채 → 밝은 몸통 → 하얀 심지) + 머리/발사구/반사 지점의 섬광
function drawLaser(an) {
  const P = an.path, n = P.length, hi = Math.min(an.i, n - 1), hf = hi | 0, TAIL = 36, col = pc(an.by) || '#ffffff', now = performance.now();
  const f = an.i < n ? 1 : Math.max(0, 1 - (an.i - (n - 1)) / TAIL);   // 끝난 뒤 사라지는 정도
  const w = (.3 + .7 * f) * (1 + .06 * Math.sin(now / 35));            // 살짝 일렁이는 굵기
  const flare = (x, y, r, a) => {

  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); for (let k = 1; k <= hf; k++) ctx.lineTo(P[k][0], P[k][1]);

// ----- 카메라: 지금 차례인 탱크(포탄이 날아가는 동안엔 포탄)를 부드럽게 따라가요 -----
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ----- 화면 밖 상대: 가장자리에 방향 화살표 + 내 탱크로부터의 거리(m) -----
function drawOffscreen() {
  if (!st || st.type !== 'state' || st.winner !== -1) return;
  const mine = me >= 0 && st.players[me].on && st.players[me].hp > 0;
  const ref = mine ? st.players[me] : { x: cam.x + VW / 2, y: cam.y + VH / 2 };
  const L = 110, R = VW - 110, T = 170, B = VH - 560, cx = VW / 2, cy = VH / 2;   // 컨트롤(파워/조준)·상단 표시줄을 피하는 안쪽 사각형
  const placed = [];

  if (st.phase === 'order' && st.target) { const ty = st.terrain[st.target.x]; items.push({ x: st.target.x, y: ty - 60, col: '#ffe94a', i: 7, label: `🎯 ${Math.round(Math.hypot(st.target.x - ref.x, ty - ref.y) / MPP)}m` }); }

    ctx.fillStyle = '#fff'; ctx.fillText(label, ox, oy + 1);

// ----- 풍속: 중앙 상단 화살표 (방향 + 길이 = 세기) -----
function setWind(w) {

  $('wt').textContent = a ? `바람 ${a} m/s` : '바람 없음';

// ----- 소이탄 불길: 땅 위에서 타오르는 불꽃 (남은 수명이 줄면 약해져요) -----
function drawFires() {
  if (!st.fires || !st.fires.length) return;
  const now = performance.now(), gy = x => st.terrain[Math.max(0, Math.min(W - 1, Math.round(x)))];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  st.fires.forEach((f, fi) => {
    ctx.globalAlpha = 1;
    if (f.x + f.r * 1.2 < cam.x || f.x - f.r * 1.2 > cam.x + VW) return;

    gl.addColorStop(0, `rgba(255,140,40,${.75 * fade})`); gl.addColorStop(.6, `rgba(255,90,25,${.35 * fade})`); gl.addColorStop(1, 'rgba(255,60,20,0)');

function flameSprite() {   // 불꽃 알갱이 그림을 한 번만 만들어 두고 재사용해요 (매 프레임 그라데이션 수십 개를 만들지 않도록)

// 탱크 표시 위치: 서버가 알려 준 좌표(걸음마다 뚝뚝 바뀜)를 시간 기준으로 부드럽게 따라가요
function stepVis() {
  const ka = 1 - Math.exp(-FS * 16.667 / 55);   // 각도·파워는 정수로 툭툭 바뀌니까 화면에서는 부드럽게 따라가요
  if (cam.snap) { pv.a = my.angle; pv.p = my.power; }
  else { pv.a += (my.angle - pv.a) * ka; pv.p += (my.power - pv.p) * ka; if (Math.abs(my.angle - pv.a) < .01) pv.a = my.angle; if (Math.abs(my.power - pv.p) < .01) pv.p = my.power; }
  st.players.forEach((p, i) => {
    const t = i === me ? pv.a : aims[i];

  });

    const v = vis[i];
    if (!v || cam.snap || Math.abs(p.x - v.x) > 260 || Math.abs(p.y - v.y) > 400) { vis[i] = { x: p.x, y: p.y }; return; }
    v.x += (p.x - v.x) * k; v.y += (p.y - v.y) * k;
    if (Math.abs(p.x - v.x) < .05) v.x = p.x; if (Math.abs(p.y - v.y) < .05) v.y = p.y;

function draw() {
  if (!st || st.type !== 'state') return;
  const th = MAPS[st.map], now = performance.now();
  if (sceneKey !== st.terrain) {
    let full = !sceneT || sceneMap !== st.map || sceneKey === null, x0 = 0, x1 = 0;
    if (!full) {   // 지난번과 달라진 구간만 찾아요
      const A = sceneT, B = st.terrain; let lo = -1, hi = -1;
      for (let i = 0; i < B.length; i++) if (A[i] !== B[i]) { if (lo < 0) lo = i; hi = i; }
      if (lo < 0) { sceneKey = st.terrain; sceneT = B; }

      catch (e) {   // 배경 생성이 실패해도 게임은 보이게: 단순 배경 + 지형만 그려요
        console.error('buildScene', e);
        const c = sceneCv.getContext('2d'); c.setTransform(S, 0, 0, S, 0, 0); c.fillStyle = '#0a1030'; c.fillRect(0, 0, W, H);
        c.fillStyle = th.neon; c.beginPath(); c.moveTo(0, H); st.terrain.forEach((y, x) => c.lineTo(x, y)); c.lineTo(W, H); c.closePath(); c.fill();
        edgePath = null;

  ctx.translate(-cam.x, -cam.y);

  twink.forEach(s => { const sx = s.x * K; if (sx < cam.x - 20 || sx > cam.x + VW + 20) return; ctx.fillStyle = `rgba(255,255,255,${.12 + .55 * Math.abs(Math.sin(now / 1000 * s.sp + s.ph))})`; ctx.beginPath(); ctx.arc(s.x * K, s.y * K, s.r * K, 0, 7); ctx.fill(); });
  if (TC && edgePath) { ctx.globalAlpha = .08 + .07 * Math.sin(now / 450); ctx.strokeStyle = TC.glow(1); ctx.lineWidth = 14; ctx.save(); ctx.scale(K, K); const vx0 = cam.x / K - 20, vx1 = (cam.x + VW) / K + 20; edgePath.forEach(e => { if (e.x1 >= vx0 && e.x0 <= vx1) ctx.stroke(e.p); }); ctx.restore(); }   // 숨쉬는 지형 빛
  ctx.restore();

  drawFires();
  if (st.target && (st.phase === 'order' || performance.now() < rankUntil)) drawTarget();
  const alive = st.players.map((p, i) => p.on && p.hp > 0);
  const rp = st.players.map((p, i) => vis[i] ? { ...p, x: vis[i].x, y: vis[i].y } : p);
  rp.forEach((p, i) => { if (alive[i]) drawTank(p, i, aimVis[i] ?? aims[i], isTurn(i)); });
  rp.forEach((p, i) => { if (alive[i]) drawTag(p, i, isTurn(i)); });
  const ordering = st.phase === 'order';
  if (!anim && st.winner === -1 && me >= 0 && alive[me] && (ordering ? canOrderFire() : st.turn === me)) drawPreview(ordering ? { ...rp[me], tank: 'basic' } : rp[me], pc(me));   // 순서 정하기는 모두 기본탄 물리

  if (anim) {
    const A = anim; let maxLen = A.carpet ? A.carpet.total : 0;
    const tail = A.kind === 'laser' ? 36 : 0;   // 레이저는 머리가 끝난 뒤에도 꼬리가 사라질 때까지 그려요
    A.shells.forEach(s => { maxLen = Math.max(maxLen, s.path.length + tail); if (A.i < s.path.length + tail) drawShell({ path: s.path, i: A.i, by: s.by ?? A.by, kind: A.kind, dud: A.dud, small: A.kind === 'cluster', big: A.kind === 'heavy', z: A.kind === 'bumper' ? [1.7, 1.3, 1][s.splits.filter(q => q <= A.i).length] : 0 }); });
    if (A.carpet) drawCarpet(A);
    A.i += (A.kind === 'heavy' ? .6 : 1) * FMAP.SHOT_SPEED * FS;   // 광폭탄은 느리게 날아가요
    A.shells.forEach(s => {
      if (A.kind === 'bumper') { A.bset = A.bset || new Set(); s.splits.forEach(q => { const key = s.path[q][0] + ',' + q; if (A.i >= q && !A.bset.has(key)) { A.bset.add(key); spawnBoom(s.path[q][0], s.path[q][1], .3); } }); }   // 튈 때마다 작은 불꽃
      if (s.boomed || A.i < s.path.length) return;
      s.boomed = true;
      const e = s.path[s.path.length - 1];
      if (s.impact && A.order) spawnBoom(s.impact[0], s.impact[1], .9);   // 순서 정하기: 지형은 안 파여요
      else if (s.impact) spawnBoom(s.impact[0], s.impact[1], A.kind === 'bumper' ? [1.6, 1.25, .95][s.gen || 0] : { cluster: .55, incendiary: 1.2, homing: 1.3, heavy: 2.6, pierce: 1, laser: .5 }[A.kind] || 1.5);
      else if (A.dud) { spawnBoom(e[0], e[1], 1.1, true); FX.floats.push({ x: e[0], y: e[1] - 30, t: 0, txt: '불발!', big: false }); }
    });
    if (A.i >= maxLen) { const next = A.pending; fxFromDiff(st, next); anim = null; apply(next); if (A.order) showRank(A.ranks); else if (A.by === me) sendMsg({ type: 'landed' }); }
  }
  drawFx();
  if (FX.flash > .01) { ctx.fillStyle = `rgba(255,255,255,${FX.flash})`; ctx.fillRect(-20, -20, W + 40, H + 40); FX.flash *= Math.pow(.78, FS); }
  drawOffscreen();
}
// 프레임 시간을 재서 애니메이션 속도를 맞추고, 계속 느리면 화면 해상도를 한 단계씩 낮춰요
let lastT = 0, slow = 0, qLock = 0;
(function loop(t) {

  FS = Math.min(4, Math.max(.25, dt / 16.667));

show('menu');
layout();
