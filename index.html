<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>증강 포트리스</title>
<style>
  :root{--bg:#04061a;--card:#080d28;--bd:#2a3556;--tx:#eef1ff;--sub:#9aa5c8;--in:#10163a;--pri:#8a3d14;--pri2:#c9651f;--btn:#1b2447}
  body.light{--bg:#eef2fb;--card:#fff;--bd:#c9d2ea;--tx:#1a2140;--sub:#5a6485;--in:#f3f6fd;--pri:#e8873a;--pri2:#f5a25d;--btn:#e3e9f8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}
  .card{width:calc(100% - 32px);max-width:480px;margin:28px 16px;padding:22px;border:2px solid var(--bd);border-radius:32px;background:var(--card);position:relative}
  h1{text-align:center;margin:8px 0 4px;font-size:30px}
  h2{margin:4px 0 8px}
  h3{margin:18px 0 8px;font-size:16px}
  .sub{text-align:center;color:var(--sub);margin:0 0 6px}
  .logo{width:84px;height:84px;margin:14px auto 0;border-radius:24px;border:2px solid var(--pri2);background:var(--in);display:flex;align-items:center;justify-content:center;font-size:44px}
  .chip{position:absolute;top:18px;right:18px;background:var(--btn);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:14px}
  input,select{font-size:16px;padding:13px;border-radius:16px;border:2px solid var(--bd);background:var(--in);color:var(--tx);width:100%;min-width:0}
  .mono{font-family:monospace;font-size:14px}
  .row{display:flex;gap:10px;align-items:stretch}
  button{font-size:16px;border:0;border-radius:16px;color:var(--tx);background:var(--btn);padding:12px 16px;white-space:nowrap}
  button.pri{background:var(--pri);color:#fff;font-weight:bold}
  button.dan{background:#a33;color:#fff}
  button:disabled{opacity:.45}
  #conn{margin:6px 2px;font-size:13px;color:var(--sub)}
  #msg{color:#fc6;min-height:20px;margin-top:6px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pc{border:2px solid var(--bd);border-top-width:6px;border-radius:18px;padding:12px 6px;text-align:center;background:var(--in)}
  .pc.empty{border-style:dashed;color:var(--sub);padding:30px 6px}
  .pc .ic{font-size:38px;line-height:1.2}
  .pc .nm{font-weight:bold;font-size:17px;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
  .pc .tg{font-size:12px;color:var(--sub);margin-top:2px}
  .code{font-family:monospace;letter-spacing:3px;color:var(--pri2)}
  /* ---------- 게임 화면 (항상 가로) ---------- */
  #game{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;--ch:100vh}
  /* 전체화면/방향 잠금이 안 되는 터치 기기(iOS 등)에서 세로로 들고 있으면 화면을 90° 돌려서 가로로 보여줘요 */
  #game.force-land{inset:auto;top:0;left:0;width:var(--sh);height:var(--sw);transform-origin:0 0;transform:translateX(var(--sw)) rotate(90deg)}
  #c{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #info{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#050a08ee;border:1px solid #00bf63;box-shadow:0 0 10px #00bf6366,0 3px 10px #0008;color:#fff;padding:6px 16px;border-radius:14px;font-size:15px;font-weight:bold;white-space:nowrap;z-index:5}

  /* 컨트롤 크기는 화면 높이에 맞춰 자동 조절 */
  #game{--g:#00bf63;--gl:#4dffa8;--bk:#050a08}
  .pad,#fire,#fuel,#rd,#pw{--s:clamp(96px,calc(var(--ch) * .36),150px);--hh:clamp(66px,calc(var(--ch) * .22),96px);--mw:calc(var(--hh) * 2.3);--fw:calc(var(--s) * .66);--m:max(14px,env(safe-area-inset-left,0px));--b:max(14px,env(safe-area-inset-bottom,0px));--bw:6px}

  /* ---------- 육각형 프레임 (검정 바탕 + 초록 테두리) ---------- */
  .hexpad,#pw{--hexc:polygon(28% 0,72% 0,100% 50%,72% 100%,28% 100%,0 50%)}
  #am{--hexc:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
  .hexbg{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(0 0 7px #00bf6388) drop-shadow(0 5px 8px #000b);transition:filter .15s}
  .hexbg::before,.hexbg::after{content:"";position:absolute}
  .hexbg::before{inset:0;background:var(--g);clip-path:var(--hexc)}
  .hexbg::after{inset:var(--bw) calc(var(--bw) * 1.7);background:linear-gradient(#0c1713,#000 65%);clip-path:var(--hexc)}
  .pad.on .hexbg,#pw.on .hexbg{filter:drop-shadow(0 0 13px #4dffa8cc) drop-shadow(0 5px 8px #000b)}

  .pad{position:absolute;bottom:var(--b);touch-action:none;z-index:5}
  .pad::after,#pw::after{content:attr(data-l);position:absolute;top:-27px;left:50%;transform:translateX(-50%);padding:2px 12px;border-radius:10px;background:#050a08ee;border:1px solid var(--g);color:#d8ffe9;font-size:12px;font-weight:bold;letter-spacing:2px;white-space:nowrap;pointer-events:none}
  #mv{left:var(--m);width:var(--mw);height:var(--hh);--k:calc(var(--hh) * .74)}
  #am{right:var(--m);width:var(--s);height:var(--s);--k:calc(var(--s) * .28)}

  /* 이동 조이스틱: 육각형 안에서 좌우로 미끄러지는 회색 원형 노브 */
  .ar{position:absolute;top:50%;margin-top:-.62em;font-style:normal;font-size:calc(var(--hh) * .2);color:var(--g);pointer-events:none;text-shadow:0 0 6px #00bf63}
  .ar.l{left:11%}.ar.r{right:11%}
  .knob{position:absolute;left:50%;top:50%;width:var(--k);height:var(--k);margin:calc(var(--k) / -2);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 28%,#fff 0,#ececec 22%,#cbced2 60%,#8d9298 100%);
    border:2px solid #0b2418;box-shadow:0 5px 9px #000c,0 0 10px #ffffff2a,inset 0 -5px 8px #0006,inset 0 3px 4px #ffffffaa}
  .knob::after{content:"";position:absolute;inset:24%;border-radius:50%;border:2px solid #00bf6399;background:radial-gradient(circle at 40% 35%,#ffffff55,#0000 70%)}
  .knob.snap{transition:transform .16s ease-out}

  /* 조준 조이스틱: 육각형 + 반원 가이드 위를 도는 초록 노브 */
  .arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .beam{position:absolute;left:50%;top:50%;height:4px;margin-top:-2px;width:0;transform-origin:0 50%;border-radius:2px;pointer-events:none;
    background:linear-gradient(90deg,#4dffa800,#4dffa8ee);box-shadow:0 0 8px #4dffa8aa}
  #am .knob{background:radial-gradient(circle at 36% 28%,#eafff3 0,#7dffb5 18%,#00bf63 55%,#04502b 100%);border-color:#04210f;box-shadow:0 5px 9px #000c,0 0 14px #00bf63aa,inset 0 -5px 8px #0008,inset 0 3px 4px #ffffff88}
  #am .knob::after{border-color:#04210f88}

  /* ---------- 파워 바: 육각형 안이 노랑 → 주황 그라데이션으로 차올라요 ---------- */
  #pw{position:absolute;left:calc(var(--m) + var(--mw) + 16px);right:calc(var(--m) + var(--s) + var(--fw) + 44px);bottom:var(--b);height:var(--hh);z-index:5;touch-action:none}
  .pw-inner{position:absolute;inset:calc(var(--bw) * 2.3) calc(var(--bw) * 4.2);clip-path:var(--hexc);overflow:hidden;pointer-events:none}
  .pw-fill{position:absolute;inset:0;background:linear-gradient(90deg,#ffff1f 0,#ffe21a 28%,#ffc01f 58%,#ff9b1f 100%);clip-path:inset(0 50% 0 0)}
  .pw-inner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 calc(10% - 1.5px),#0007 calc(10% - 1.5px) 10%)}
  .pw-mark{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px #fff,0 0 14px #ffd54a}

  /* ---------- 발사 버튼 (조이스틱과 분리된 독립 버튼) ---------- */
  #fire{position:absolute;right:calc(var(--m) + var(--s) + 20px);bottom:calc(var(--b) + 4px);width:var(--fw);height:var(--fw);padding:0;border:0;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gl);touch-action:none;z-index:5;
    background:radial-gradient(circle at 50% 28%,#1d3329 0,#07100c 60%,#000 100%);
    box-shadow:0 0 0 3px var(--g),0 0 0 6px #030806,0 0 0 8px #0b6b3a,0 8px 16px 4px #000b,inset 0 0 18px #00bf6366,inset 0 6px 8px #ffffff1c;
    animation:fpulse 1.4s ease-in-out infinite;transition:transform .08s}
  #fire .fi{width:34%;height:auto;filter:drop-shadow(0 0 5px #00bf63)}
  #fire b{font-size:clamp(14px,calc(var(--ch) * .042),20px);letter-spacing:2px;text-shadow:0 0 8px #00bf63}
  #fire:active:not(:disabled){transform:scale(.93);background:radial-gradient(circle at 50% 28%,#4dffa8 0,#00bf63 70%,#04502b 100%);color:#021409;box-shadow:0 0 0 3px var(--gl),0 0 0 6px #030806,0 0 0 8px #0b6b3a,0 4px 8px 2px #000b,inset 0 0 14px #ffffff55}
  #fire:active:not(:disabled) .fi,#fire:active:not(:disabled) b{filter:none;text-shadow:none}
  #fire:disabled{animation:none;filter:grayscale(.85) brightness(.55)}
  @keyframes fpulse{0%,100%{filter:drop-shadow(0 0 4px #00bf6366)}50%{filter:drop-shadow(0 0 16px #4dffa8)}}
  @media (max-width:640px){#pw{left:calc(var(--m) + var(--mw) + 10px);right:calc(var(--m) + var(--s) + var(--fw) + 30px)}#fire{right:calc(var(--m) + var(--s) + 10px)}}

  /* ---------- 상태 표시 ---------- */
  #fuel{position:absolute;left:var(--m);bottom:calc(var(--b) + var(--hh) + 40px);width:var(--mw);height:12px;background:#050a08ee;border:1px solid var(--g);border-radius:7px;overflow:hidden;z-index:5;box-shadow:0 0 8px #00bf6355,inset 0 2px 4px #000a}
  #fb{display:block;height:100%;width:0;background:linear-gradient(#ffe27a,#f0a010);border-radius:7px;box-shadow:0 0 6px #fc3a}
  #rd{position:absolute;right:var(--m);bottom:calc(var(--b) + var(--s) + 40px);color:#d8ffe9;background:#050a08ee;border:1px solid var(--g);padding:3px 10px;border-radius:10px;font-size:13px;font-weight:bold;z-index:5;box-shadow:0 0 8px #00bf6355}
  #fs{display:none;position:absolute;inset:0;background:#000d;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:20px;line-height:1.6;z-index:20}
</style>
</head>
<body>

<div id="menu" class="card">
  <button id="theme" class="chip">☀️ 라이트</button>
  <div class="logo">💥</div>
  <h1>증강 포트리스</h1>
  <p class="sub">지형을 부수고 마지막까지 살아남으세요!</p>

  <h3>내 닉네임 및 탱크 모양</h3>
  <div class="row"><input id="name" maxlength="8" placeholder="닉네임"><select id="icon"></select></div>

  <h3>Render 서버 URL 주소</h3>
  <input id="url" class="mono" placeholder="https://내서버.onrender.com" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="conn"></div>

  <div class="row" style="margin-top:10px">
    <button id="create" class="pri" style="flex:1.2">🏠 방 만들기</button>
    <input id="code" maxlength="4" placeholder="방 코드" style="flex:1;text-transform:uppercase">
    <button id="join">참가</button>
  </div>
  <div id="msg"></div>
  <h3>열린 방</h3>
  <div id="rooms"></div>
</div>

<div id="room" class="card" hidden>
  <h2>방 코드 <span id="rc" class="code"></span></h2>
  <div id="cards" class="cards"></div>
  <h3>맵 <span id="mapnote" style="font-size:12px;color:var(--sub)"></span></h3>
  <div id="maps"></div>
  <div class="row" style="margin-top:14px">
    <button id="start" class="pri" style="flex:1">게임 시작</button>
    <button id="leave" class="dan">나가기</button>
  </div>
  <div id="rmsg" style="margin-top:10px;color:var(--sub)"></div>
</div>

<div id="game" hidden>
  <canvas id="c" width="1000" height="600"></canvas>
  <div id="info"></div>
  <div id="fuel"><i id="fb"></i></div>
  <div id="mv" class="pad hexpad" data-l="이동"><div class="hexbg"></div><i class="ar l">◀</i><i class="ar r">▶</i><div class="knob"></div></div>
  <div id="rd"></div>
  <div id="am" class="pad" data-l="조준"><div class="hexbg"></div><svg class="arc" viewBox="-50 -50 100 100"><path d="M -29 0 A 29 29 0 0 1 29 0" fill="none" stroke="#4dffa8" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="1.6 3.4" stroke-linecap="round"/></svg><i id="beam" class="beam"></i><div class="knob"></div></div>
  <button id="fire"><svg class="fi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg><b>발사</b></button>
  <div id="pw" data-l="파워 50"><div class="hexbg"></div><div class="pw-inner"><div class="pw-fill" id="pwf"></div><div class="pw-mark" id="pwm"></div></div></div>
  <div id="fs">👆 화면을 터치하면<br>가로 전체화면으로 시작해요</div>
</div>

<script src="maps.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), W = 1000, H = 600;
const COLORS = ['#2a6fdb', '#d33', '#2a2', '#e90'];
const ICONS = [['🪖', '탱크'], ['🐸', '개구리'], ['🚀', '우주선'], ['🐱', '고양이'], ['🤖', '로봇'], ['🦖', '공룡']];
const MAPS = FMAP.MAPS, RANDOM = MAPS.length;
let ws = null, wsUrl = '', pending = null, retry = null;
let me = -1, st = null, anim = null, boom = null, fresh = true, rooms = [];
const aims = [90, 90, 90, 90], my = { angle: 90, power: 50 };

const ls = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
function el(tag, text, parent, css) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (css) e.style.cssText = css;
  parent.appendChild(e);
  return e;
}
function show(v) {
  const was = !$('game').hidden;
  ['menu', 'room', 'game'].forEach(x => { $(x).hidden = x !== v; });
  if (was && v !== 'game') exitFS();
}
const sendMsg = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

// ---------- 테마 / 입력 초기값 ----------
function setTheme(light) {
  document.body.classList.toggle('light', light);
  $('theme').textContent = light ? '🌙 다크' : '☀️ 라이트';
  ls.set('theme', light ? 'light' : 'dark');
}
$('theme').onclick = () => setTheme(!document.body.classList.contains('light'));
setTheme(ls.get('theme') === 'light');

ICONS.forEach(([e, n]) => { const o = el('option', `${e} ${n}`, $('icon')); o.value = e; });
$('name').value = ls.get('nick') || '여행자';
$('icon').value = ls.get('icon') || ICONS[0][0];
$('url').value = ls.get('url') || (location.protocol.startsWith('http') ? location.origin : '');
const profile = () => {
  const name = $('name').value.trim() || '여행자';
  ls.set('nick', name); ls.set('icon', $('icon').value);
  return { name, icon: $('icon').value };
};

// ---------- 서버 연결 ----------
function toWs(u) {
  u = u.trim().replace(/\/+$/, '');
  if (!u) return '';
  if (/^wss?:\/\//.test(u)) return u;
  if (/^https?:\/\//.test(u)) return u.replace(/^http/, 'ws');
  return (/^(localhost|127\.|192\.168\.)/.test(u) ? 'ws://' : 'wss://') + u;
}
function setConn(level, text) { $('conn').textContent = ['🔴 ', '🟡 ', '🟢 '][level] + text; }

function connect() {
  clearTimeout(retry);
  const u = toWs($('url').value);
  if (!u) { setConn(0, '서버 URL을 입력해 주세요'); return; }
  wsUrl = u; ls.set('url', $('url').value.trim());
  if (ws) { ws.onclose = null; ws.close(); }
  setConn(1, '연결 중... (Render 무료 서버는 깨어나는 데 최대 1분 걸려요)');
  let s;
  try { s = new WebSocket(u); } catch (e) { setConn(0, '올바르지 않은 주소예요'); return; }
  ws = s;
  s.onopen = () => {
    if (ws !== s) return;
    setConn(2, '서버에 연결됨'); $('msg').textContent = '';
    if (pending) { const p = pending; pending = null; sendMsg(p); }
  };
  s.onmessage = e => { if (ws === s) onMsg(JSON.parse(e.data)); };
  s.onclose = () => {
    if (ws !== s) return;
    ws = null; show('menu'); me = -1; st = null; anim = null;
    setConn(0, '연결이 끊겼어요. 다시 연결하는 중...');
    retry = setTimeout(connect, 2500);
  };
}
function act(m) {
  if (toWs($('url').value) !== wsUrl || !ws || ws.readyState > 1) { pending = m; connect(); $('msg').textContent = '서버에 연결하는 중이에요...'; return; }
  if (ws.readyState === 0) { pending = m; $('msg').textContent = '서버에 연결하는 중이에요...'; return; }
  sendMsg(m);
}
$('url').onchange = connect;

function onMsg(m) {
  if (m.type === 'rooms') { rooms = m.rooms; renderRooms(); }
  else if (m.type === 'joined') me = m.you;
  else if (m.type === 'error') $('msg').textContent = m.msg;
  else if (m.type === 'room' || m.type === 'state') { if (anim) anim.pending = m; else apply(m); }
  else if (m.type === 'moved') {
    const t = anim ? anim.pending : st;
    if (t && t.players) { const p = t.players[m.i]; p.x = m.x; p.y = m.y; t.fuel = m.fuel; }
    ui();
  }
  else if (m.type === 'shot') { aims[m.by] = m.angle; anim = { path: m.path, i: 0, impact: m.impact, pending: m.state }; ui(); }
}

// ---------- 메뉴 ----------
$('create').onclick = () => act({ type: 'create', ...profile() });
$('join').onclick = () => joinRoom($('code').value);
function joinRoom(code) { $('msg').textContent = ''; act({ type: 'join', code, ...profile() }); }

function renderRooms() {
  const box = $('rooms'); box.textContent = '';
  if (!rooms.length) el('div', '열린 방이 없어요. 방을 만들어 보세요.', box, 'color:var(--sub)');
  rooms.forEach(r => {
    const label = `${r.code} · ${r.host}의 방 · ${r.count}/4 · ${r.map === RANDOM ? '랜덤' : MAPS[r.map].name}${r.playing ? ' (게임 중)' : ''}`;
    const b = el('button', label, box, 'display:block;margin:6px 0;width:100%;text-align:left');
    b.disabled = r.playing || r.count >= 4;
    b.onclick = () => joinRoom(r.code);
  });
}

// ---------- 대기실 ----------
function preview(c, id) {
  const x = c.getContext('2d');
  if (id === RANDOM) {
    x.fillStyle = '#333'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#fff'; x.font = '36px sans-serif'; x.textAlign = 'center'; x.fillText('?', c.width / 2, 46);
    return;
  }
  const m = MAPS[id], t = FMAP.terrain(id), sx = c.width / W, sy = c.height / H;
  const g = x.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0, m.sky[0]); g.addColorStop(1, m.sky[1]);
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = m.ground; x.beginPath(); x.moveTo(0, c.height);
  for (let i = 0; i < W; i += 5) x.lineTo(i * sx, t[i] * sy);
  x.lineTo(c.width, c.height); x.fill();
}
const mapCards = [];
for (let id = 0; id <= RANDOM; id++) {
  const d = el('div', null, $('maps'), 'display:inline-block;margin:4px;padding:4px;border:2px solid var(--bd);border-radius:12px;cursor:pointer;text-align:center');
  const c = el('canvas', null, d); c.width = 120; c.height = 70;
  preview(c, id);
  el('div', id === RANDOM ? '랜덤' : MAPS[id].name, d);
  d.onclick = () => { if (st && st.type === 'room' && me === st.host) sendMsg({ type: 'map', id }); };
  mapCards.push(d);
}

function renderRoom() {
  $('rc').textContent = st.code;
  const box = $('cards'); box.textContent = '';
  st.names.forEach((n, i) => {
    const c = el('div', null, box, `border-top-color:${n ? COLORS[i] : 'var(--bd)'}`);
    c.className = 'pc' + (n ? '' : ' empty');
    if (!n) { el('div', '대기 중...', c); return; }
    el('div', st.icons[i] || '🪖', c).className = 'ic';
    el('div', n, c).className = 'nm';
    el('div', `P${i + 1}${i === st.host ? ' · 👑 방장' : ''}${i === me ? ' · 나' : ''}`, c).className = 'tg';
  });
  const isHost = me === st.host, cnt = st.names.filter(Boolean).length;
  mapCards.forEach((d, i) => {
    d.style.borderColor = i === st.mapId ? '#ff0' : 'var(--bd)';
    d.style.opacity = isHost || i === st.mapId ? 1 : 0.6;
  });
  $('mapnote').textContent = isHost ? '(방장이 선택)' : '(방장이 선택해요)';
  $('start').hidden = !isHost;
  $('start').disabled = cnt < 2;
  $('rmsg').textContent = cnt < 2 ? '2명 이상 모이면 시작할 수 있어요. 방 코드를 친구에게 알려주세요.' : '';
}
$('start').onclick = () => { enterFS(); sendMsg({ type: 'start' }); };
$('leave').onclick = () => { sendMsg({ type: 'leave' }); me = -1; st = null; show('menu'); };

function apply(m) {
  st = m;
  if (m.type === 'room') { fresh = true; show('room'); renderRoom(); return; }
  show('game');
  if (fresh) {
    fresh = false;
    m.players.forEach((p, i) => { aims[i] = p.x < 500 ? 45 : 135; });
    my.angle = aims[me]; placeAim(); setPower(50); showFsPrompt();
  }
  ui();
}

function canAct() {
  return st && st.type === 'state' && me >= 0 && st.turn === me && st.winner === -1 && !anim && st.players[me].hp > 0;
}

function ui() {
  if (!st || st.type !== 'state') return;
  const mine = me >= 0 && st.players[me].on && st.players[me].hp > 0;
  $('fire').disabled = !canAct();
  $('rd').textContent = mine ? `각도 ${my.angle}° · 파워 ${my.power}` : '관전 중';
  $('fb').style.width = (st.turn === me && st.winner === -1 ? Math.max(0, st.fuel) / 200 * 100 : 0) + '%';
  let t;
  if (st.winner !== -1) t = (st.winner === -2 ? '무승부' : st.winner === me ? '승리!' : `${st.players[st.winner].name} 승리`) + ' (잠시 후 대기실로)';
  else t = (st.turn === me ? '내 차례' : `${st.players[st.turn].name}의 차례`) + ' · 바람 ' + (st.wind > 0 ? '→ ' : st.wind < 0 ? '← ' : '') + Math.abs(st.wind);
  $('info').textContent = t;
}

// ---------- 가로 전체화면 ----------
const rootEl = document.documentElement;
const fsOK = !!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen);
const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
async function enterFS() {
  try { if (!inFS() && fsOK) await (rootEl.requestFullscreen || rootEl.webkitRequestFullscreen).call(rootEl); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  layout();
}
function exitFS() {
  try { screen.orientation.unlock(); } catch (e) {}
  try { if (inFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
}
function showFsPrompt() { $('fs').style.display = fsOK && !inFS() && !$('game').hidden ? 'flex' : 'none'; }
$('fs').onclick = () => { enterFS(); $('fs').style.display = 'none'; };
function onFsChange() { layout(); if (!$('game').hidden) showFsPrompt(); }
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);

// 화면 방향/크기에 맞춰 레이아웃 갱신: 터치 기기에서 세로면 게임 화면을 돌려서 가로로 보여줘요
function layout() {
  const w = innerWidth, h = innerHeight, g = $('game');
  const rot = matchMedia('(pointer:coarse)').matches && h > w;
  g.classList.toggle('force-land', rot);
  g.style.setProperty('--sw', w + 'px');
  g.style.setProperty('--sh', h + 'px');
  g.style.setProperty('--ch', (rot ? w : h) + 'px');
  placeAim();
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 150));

// ---------- 조이스틱 (이동 / 조준 분리) ----------
function makePad(pad, onMove, resetOnEnd, opts = {}) {
  const knob = pad.querySelector('.knob'); let drag = false;
  const upd = e => {
    const r = pad.getBoundingClientRect(), Rm = opts.rm ? opts.rm(pad) : pad.offsetWidth / 2 * 0.7;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if ($('game').classList.contains('force-land')) [dx, dy] = [dy, -dx]; // 90° 회전 보정
    if (opts.horiz) dy = 0;                                                // 이동 조이스틱은 좌우로만
    const h = Math.hypot(dx, dy), k = Math.min(h, Rm) / (h || 1);
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
    onMove(dx, dy, Rm, h);
  };
  pad.onpointerdown = e => { drag = true; pad.classList.add('on'); knob.classList.remove('snap'); pad.setPointerCapture(e.pointerId); upd(e); };
  pad.onpointermove = e => { if (drag) upd(e); };
  pad.onpointerup = pad.onpointercancel = () => {
    drag = false; pad.classList.remove('on');
    if (resetOnEnd) { knob.classList.add('snap'); knob.style.transform = ''; onMove(0, 0, 1, 0); }
  };
}

// 이동: 좌우로 밀면 이동 (턴마다 연료 한도 안에서)
let mvDir = 0;
makePad($('mv'), (dx, dy, Rm) => { mvDir = dx > Rm * 0.3 ? 1 : dx < -Rm * 0.3 ? -1 : 0; }, true, { horiz: true, rm: p => p.offsetHeight * 0.46 });
setInterval(() => { if (mvDir && canAct() && st.fuel > 0) sendMsg({ type: 'move', dir: mvDir }); }, 40);

// 조준: 방향 = 각도(0~180°), 당긴 거리 = 파워. 놓아도 값은 유지돼요.
makePad($('am'), (dx, dy, Rm, h) => {   // 조준 조이스틱: 각도만 담당
  if (me < 0) return;
  if (h < Rm * 0.2) { placeAim(); return; }  // 중앙 근처는 무시
  let ang = Math.atan2(-dy, dx) * 180 / Math.PI;
  if (ang < 0) ang = dx >= 0 ? 0 : 180;
  my.angle = Math.round(ang);
  aims[me] = my.angle; placeAim(); ui();
}, false, { rm: p => p.offsetWidth * 0.29 });

// 파워 막대: 막대를 직접 터치/드래그해서 조절
function setPower(p) {
  my.power = Math.max(10, Math.min(100, Math.round(p)));
  $('pw').dataset.l = '파워 ' + my.power;
  $('pwm').style.left = my.power + '%';
  $('pwf').style.clipPath = `inset(0 ${100 - my.power}% 0 0)`;
  ui();
}
(function () {
  const pw = $('pw'), hit = pw.querySelector('.pw-inner'); let drag = false;
  const upd = e => {
    const r = hit.getBoundingClientRect(), rot = $('game').classList.contains('force-land');
    const f = rot ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width; // 화면을 돌린 경우 가로축 = 화면 세로
    setPower(f * 100);
  };
  pw.onpointerdown = e => { drag = true; pw.classList.add('on'); pw.setPointerCapture(e.pointerId); upd(e); };
  pw.onpointermove = e => { if (drag) upd(e); };
  pw.onpointerup = pw.onpointercancel = () => { drag = false; pw.classList.remove('on'); };
})();
function placeAim() {
  const pad = $('am'), d = pad.offsetWidth * 0.29, a = my.angle * Math.PI / 180;
  pad.querySelector('.knob').style.transform = `translate(${Math.cos(a) * d}px,${-Math.sin(a) * d}px)`;
  setBeam();
}
function setBeam() {
  const pad = $('am'), d = pad.offsetWidth * 0.29, b = $('beam');
  b.style.width = d + 'px'; b.style.transform = `rotate(${-my.angle}deg)`;
}

// 발사: 별도 버튼
$('fire').onclick = () => {
  if (!canAct()) return;
  sendMsg({ type: 'fire', angle: my.angle, power: my.power });
  $('fire').disabled = true;
};

// ---------- 렌더링 ----------
function shade(hex, f) { // f: -1(어둡게) ~ 1(밝게)
  let h = hex.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16), t = f < 0 ? 0 : 255, k = Math.abs(f);
  const c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v + (t - v) * k));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function lin(y0, y1, c0, c1, c2) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, c0); if (c2) g.addColorStop(0.5, c1); g.addColorStop(1, c2 || c1); return g;
}

// 레퍼런스 스타일 현대 전차: 납작한 색면, 쐐기형 포탑, 경사진 차체 + 패널 라인, 큰 바퀴 궤도.
// 아래 도형은 원본 그림 좌표(폭≈505)로 그리고 K 배율로 줄여서 써요. 지면 경사에 맞춰 기울어져요.
const TK = {
  track:  new Path2D('M60 186H448Q500 186 500 230Q500 272 456 272H54Q10 272 10 230Q10 186 60 186Z'),
  skirt:  new Path2D('M40 128H410L472 140Q505 148 505 176Q505 204 478 204H34Q0 204 0 172Q0 134 40 128Z'),
  deck:   new Path2D('M72 128L86 108H378L456 128Z'),
  turret: new Path2D('M82 100L72 62Q68 24 100 22H255L346 64V80L288 100Z'),
  band:   new Path2D('M74 70H322L346 80L288 100H82Z'),
  panels: new Path2D('M125 134V196M245 134V196M365 134V196'),
};
function drawTank(p, i, deg) {
  const col = COLORS[i], a = deg * Math.PI / 180, dir = deg <= 90 ? 1 : -1, T = st.terrain, K = 0.08;
  const x0 = Math.max(0, Math.round(p.x) - 14), x1 = Math.min(W - 1, Math.round(p.x) + 14);
  const tilt = Math.max(-0.5, Math.min(0.5, Math.atan2(T[x1] - T[x0], x1 - x0)));
  const C = { hi: shade(col, .22), lo: shade(col, -.22), dk: shade(col, -.5), trk: shade(col, -.68), whl: shade(col, -.38), ln: shade(col, -.78) };

  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(tilt);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 1.5, 22, 3, 0, 0, 7); ctx.fill();

  ctx.save(); ctx.scale(dir * K, K); ctx.translate(-250, -258);
  ctx.lineJoin = 'round'; ctx.strokeStyle = C.ln; ctx.lineWidth = 7;
  ctx.fillStyle = C.trk; ctx.fill(TK.track); ctx.stroke(TK.track);                      // 궤도
  [62, 140, 218, 296, 374, 452].forEach(x => {                                          // 바퀴
    ctx.fillStyle = C.whl; ctx.beginPath(); ctx.arc(x, 232, 32, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.trk; ctx.beginPath(); ctx.arc(x, 232, 14, 0, 7); ctx.fill();
    ctx.fillStyle = C.whl; ctx.beginPath(); ctx.arc(x, 232, 5, 0, 7); ctx.fill();
  });
  ctx.fillStyle = col; ctx.fill(TK.skirt); ctx.stroke(TK.skirt);                        // 측면 장갑(스커트)
  ctx.strokeStyle = C.lo; ctx.lineWidth = 6; ctx.stroke(TK.panels);                      // 패널 라인
  ctx.strokeStyle = C.ln; ctx.lineWidth = 7;
  ctx.fillStyle = C.dk; ctx.fill(TK.deck); ctx.stroke(TK.deck);                          // 엔진 데크
  ctx.fillStyle = C.hi; ctx.fillRect(392, 116, 64, 12);                                  // 전방 장비함
  ctx.fillStyle = C.dk; ctx.fillRect(42, 100, 70, 28); ctx.strokeRect(42, 100, 70, 28);  // 후방 적재함
  ctx.fillStyle = C.lo; ctx.fillRect(42, 100, 70, 8);
  ctx.fillStyle = C.dk; ctx.fillRect(112, 8, 62, 16); ctx.fillRect(198, 6, 66, 18);       // 해치
  ctx.fillRect(250, 10, 14, 10); ctx.fillRect(264, 12, 70, 4);                          // 기관총
  ctx.fillStyle = C.hi; ctx.fill(TK.turret);                                             // 포탑
  ctx.fillStyle = C.lo; ctx.fill(TK.band);
  ctx.stroke(TK.turret);
  ctx.restore();

  // 포신 (포탑 앞쪽 포방패에서 뻗어 나가며, 조준 각도로 회전)
  ctx.save(); ctx.translate(7.2 * dir, -16.2); ctx.rotate(-a - tilt);
  ctx.strokeStyle = C.ln; ctx.lineWidth = .6;
  ctx.fillStyle = C.hi; ctx.fillRect(1, -1.5, 23, 3); ctx.strokeRect(1, -1.5, 23, 3);
  ctx.fillStyle = C.lo; ctx.fillRect(9, -2.3, 6, 4.6); ctx.strokeRect(9, -2.3, 6, 4.6);   // 배기통
  ctx.fillStyle = C.dk; ctx.fillRect(22.5, -2.3, 3, 4.6);                                  // 포구
  rrect(-3.5, -3.9, 7, 7.8, 2); ctx.fillStyle = C.lo; ctx.fill(); ctx.stroke();            // 포방패
  ctx.restore();
  ctx.restore();

  if (p.hp <= 35) { // 심하게 다치면 연기
    const t = performance.now() / 600;
    for (let k = 0; k < 3; k++) {
      const u = (t + k / 3) % 1;
      ctx.fillStyle = `rgba(60,60,60,${0.5 * (1 - u)})`;
      ctx.beginPath(); ctx.arc(p.x - 4 * dir + Math.sin(u * 6 + k) * 4, p.y - 22 - u * 18, 3 + u * 5, 0, 7); ctx.fill();
    }
  }
}

function draw() {
  if (!st || st.type !== 'state') return;
  const th = MAPS[st.map];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const gg = ctx.createLinearGradient(0, 120, 0, H);
  gg.addColorStop(0, shade(th.ground, .12)); gg.addColorStop(1, shade(th.ground, -.4));
  ctx.fillStyle = gg; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x < W; x++) ctx.lineTo(x, st.terrain[x]);
  ctx.lineTo(W, H); ctx.fill();
  ctx.lineJoin = 'round';
  ctx.strokeStyle = shade(th.grass, -.35); ctx.lineWidth = 6; ctx.beginPath();
  for (let x = 0; x < W; x++) x ? ctx.lineTo(x, st.terrain[x] + 1.5) : ctx.moveTo(x, st.terrain[x] + 1.5);
  ctx.stroke();
  ctx.strokeStyle = th.grass; ctx.lineWidth = 4; ctx.beginPath();
  for (let x = 0; x < W; x++) x ? ctx.lineTo(x, st.terrain[x]) : ctx.moveTo(x, st.terrain[x]);
  ctx.stroke();

  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  st.players.forEach((p, i) => {
    if (!p.on || p.hp <= 0) return;
    drawTank(p, i, aims[i]);
    const hx = p.x - 22, hy = p.y - 42, hp = Math.max(0, Math.min(100, p.hp));
    ctx.fillStyle = '#000b'; rrect(hx - 1.5, hy - 1.5, 47, 10, 5); ctx.fill();
    ctx.fillStyle = hp > 60 ? '#4ade50' : hp > 30 ? '#fbbf24' : '#ef4444';
    if (hp > 0) { rrect(hx, hy, 44 * hp / 100, 7, 3.5); ctx.fill(); }
    const label = `${p.icon || ''} ${i === me ? '나' : p.name}`;
    ctx.lineWidth = 3; ctx.strokeStyle = '#000c'; ctx.strokeText(label, p.x, hy - 6);
    ctx.fillStyle = '#fff'; ctx.fillText(label, p.x, hy - 6);
    if (st.turn === i && st.winner === -1) {
      const bob = Math.sin(performance.now() / 200) * 3;
      ctx.fillStyle = '#ffe14a'; ctx.strokeStyle = '#000a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x - 6, hy - 26 + bob); ctx.lineTo(p.x + 6, hy - 26 + bob); ctx.lineTo(p.x, hy - 17 + bob); ctx.closePath(); ctx.stroke(); ctx.fill();
    }
  });

  if (anim) {
    const idx = Math.min(anim.i, anim.path.length - 1), pt = anim.path[idx];
    for (let k = 10; k >= 1; k--) {   // 포탄 꼬리
      const q = anim.path[Math.max(0, idx - k)];
      ctx.fillStyle = `rgba(255,${190 - k * 9},70,${0.45 - k * 0.04})`;
      ctx.beginPath(); ctx.arc(q[0], q[1], 3.6 - k * 0.2, 0, 7); ctx.fill();
    }
    const sg = ctx.createRadialGradient(pt[0], pt[1], 0, pt[0], pt[1], 10);
    sg.addColorStop(0, 'rgba(255,240,180,.95)'); sg.addColorStop(0.4, 'rgba(255,160,40,.5)'); sg.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(pt[0], pt[1], 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#26282d'; ctx.beginPath(); ctx.arc(pt[0], pt[1], 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff88'; ctx.beginPath(); ctx.arc(pt[0] - 1, pt[1] - 1, 1, 0, 7); ctx.fill();
    if (++anim.i >= anim.path.length) {
      if (anim.impact) boom = { x: anim.impact[0], y: anim.impact[1], t: 0, parts: Array.from({ length: 16 }, () => ({ a: Math.random() * 6.283, v: 1.5 + Math.random() * 4 })) };
      const next = anim.pending; anim = null; apply(next);
    }
  }
  if (boom) {
    const k = boom.t / 24, r = 18 + boom.t * 1.9, al = 1 - k;
    const eg = ctx.createRadialGradient(boom.x, boom.y, 0, boom.x, boom.y, r);
    eg.addColorStop(0, `rgba(255,255,230,${al})`); eg.addColorStop(0.4, `rgba(255,205,60,${0.9 * al})`);
    eg.addColorStop(0.75, `rgba(255,95,20,${0.6 * al})`); eg.addColorStop(1, 'rgba(120,30,10,0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(boom.x, boom.y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * al})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(boom.x, boom.y, r * 1.15, 0, 7); ctx.stroke();
    boom.parts.forEach(q => {
      ctx.fillStyle = `rgba(255,${150 + (q.v * 20) % 90},40,${al})`;
      ctx.beginPath(); ctx.arc(boom.x + Math.cos(q.a) * q.v * boom.t, boom.y + Math.sin(q.a) * q.v * boom.t + 0.12 * boom.t * boom.t, 2.4 * al + 0.6, 0, 7); ctx.fill();
    });
    if (++boom.t > 24) boom = null;
  }
}
(function loop() { draw(); requestAnimationFrame(loop); })();

show('menu');
layout();
if ($('url').value.trim()) connect(); else setConn(0, '서버 URL을 입력해 주세요');
</script>
</body>
</html>
