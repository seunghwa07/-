<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Apex Fortress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#04061a;--card:#080d28;--bd:#2a3556;--tx:#eef1ff;--sub:#9aa5c8;--in:#10163a;--pri:#8a3d14;--pri2:#c9651f;--btn:#1b2447}
  body.light{--bg:#eef2fb;--card:#fff;--bd:#c9d2ea;--tx:#1a2140;--sub:#5a6485;--in:#f3f6fd;--pri:#e8873a;--pri2:#f5a25d;--btn:#e3e9f8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}
  .card{width:calc(100% - 32px);max-width:480px;margin:28px 16px;padding:22px;border:2px solid var(--bd);border-radius:32px;background:var(--card);position:relative}
  h1{text-align:center;margin:8px 0 4px;font-size:30px}
  h2{margin:4px 0 8px}
  h3{margin:18px 0 8px;font-size:16px}
  .sub{text-align:center;color:var(--sub);margin:0 0 6px}
  .logo{width:84px;height:84px;margin:14px auto 0;border-radius:24px;border:2px solid var(--pri2);background:var(--in);display:flex;align-items:center;justify-content:center;font-size:44px}
  .chip{position:absolute;top:18px;right:18px;background:var(--btn);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:14px}
  input,select{font-size:16px;padding:13px;border-radius:16px;border:2px solid var(--bd);background:var(--in);color:var(--tx);width:100%;min-width:0}
  .mono{font-family:monospace;font-size:14px}
  .row{display:flex;gap:10px;align-items:stretch}
  button{font-size:16px;border:0;border-radius:16px;color:var(--tx);background:var(--btn);padding:12px 16px;white-space:nowrap}
  button.pri{background:var(--pri);color:#fff;font-weight:bold}
  button.dan{background:#a33;color:#fff}
  button:disabled{opacity:.45}
  button.sel{background:var(--pri);color:#fff;font-weight:bold;outline:2px solid var(--pri2)}
  #conn{margin:6px 2px;font-size:13px;color:var(--sub)}
  /* ---------- 메인 로비: 1280×720 무대 · 대기실과 같은 디자인 언어 (화면 크기에 맞춰 키워요) ---------- */
  #menu{position:fixed;inset:0;background:#060a1e;overflow:hidden}
  #menu[hidden]{display:none}
  #home{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:20px;
    background:radial-gradient(900px 500px at 15% -10%,#16205a 0%,rgba(22,32,90,0) 70%),radial-gradient(700px 500px at 100% 100%,#2a1050 0%,rgba(42,16,80,0) 70%),#060a1e;
    color:#eaf0ff;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;overflow:hidden}
  :where(#home) button{font:inherit;padding:0;border:0;border-radius:0;background:none;color:inherit;white-space:normal;cursor:pointer}
  :where(#home) button:disabled{cursor:not-allowed}
  :where(#home) input{width:100%;min-width:0;font:inherit;border:2px solid #2a3556;background:#080d28;color:#eaf0ff;user-select:text;box-sizing:border-box}
  :where(#home) input:focus{outline:0;border-color:#4dd2ff}
  #home .cp{font-family:'Chakra Petch','Noto Sans KR',sans-serif}
  #home .bar{width:4px;height:18px;border-radius:2px;flex:none}
  #home .sec{font-size:20px;font-weight:900}
  #home .box{position:relative;overflow:hidden;box-sizing:border-box;border-radius:20px;background:#0d1433;border:1px solid #2a3556;padding:14px 16px}
  #home .hd{display:flex;align-items:baseline;gap:14px}
  /* 상단 바: 서버 / 타이틀 / 방 코드 참가 */
  #top{height:56px;flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  #srv{justify-self:start;height:48px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-radius:14px;border:1px solid #2f5f7f;background:rgba(77,210,255,.08);color:#9fe6ff;font-size:15px;font-weight:700}
  #url{width:280px;height:36px;padding:0 12px;border-radius:10px;font-size:14px}
  #ttl{font:700 44px/1 'Chakra Petch','Noto Sans KR',sans-serif;letter-spacing:.2em;color:#fff;text-shadow:0 0 18px rgba(77,210,255,.55);padding-left:.2em}
  #jbox{justify-self:end;display:flex;align-items:center;gap:8px;padding:4px 4px 4px 16px;border-radius:16px;background:#0d1433;border:1px solid #2a3556}
  #jbox span{font-size:15px;font-weight:700;color:#a9b8de}
  #code{width:130px;height:42px;border-radius:12px;text-align:center;font:700 22px 'Chakra Petch',monospace;letter-spacing:.3em;text-transform:uppercase;padding:0 0 0 .3em}
  #join{flex:none;height:42px;padding:0 22px;border-radius:12px;background:linear-gradient(180deg,#5dffb0,#2fd48b);color:#04210f;font-size:16px;font-weight:900}
  /* 열린 방: 참가자 카드와 같은 큰 카드 */
  #rooms{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:calc(50% - 8px);gap:16px}
  .rc{position:relative;overflow:hidden;box-sizing:border-box;border-radius:20px;background:#0d1433;border:1px solid #2a3556;border-top:5px solid var(--c);padding:14px 20px;display:flex;flex-direction:column;text-align:left;color:#eaf0ff}
  .rc:hover:not(:disabled){border-color:var(--c);box-shadow:0 0 24px rgba(77,210,255,.18)}
  .rc:disabled{opacity:.55}
  .rc .blob{position:absolute;right:-50px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--c);opacity:.2;filter:blur(46px)}
  .rc .rt{position:relative;display:flex;align-items:center;justify-content:space-between}
  .rc .pp{font-weight:700;font-size:14px;color:var(--c);padding:3px 10px;border-radius:8px;border:1px solid var(--c)}
  .rc .st{font-size:14px;font-weight:900;color:#04061a;background:var(--c);padding:3px 12px;border-radius:999px}
  .rc .rcode{position:relative;flex:1;display:flex;align-items:center;justify-content:center;font:700 54px 'Chakra Petch',monospace;letter-spacing:.22em;padding-left:.22em;color:#fff;text-shadow:0 0 18px rgba(77,210,255,.5)}
  .rc .rb{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rc .rh{font-size:24px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chp{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid #3a4770;font-size:15px;font-weight:700;white-space:nowrap}
  .chp i{width:10px;height:10px;border-radius:50%;background:#fff6b0;box-shadow:0 0 8px #fff6b0}
  .rempty{grid-column:1/-1;grid-row:1/3;box-sizing:border-box;border-radius:20px;background:#0d1433;border:1px solid #2a3556;padding:18px 20px;display:flex}
  .rempty div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:14px;border:2px dashed #34406a;color:#a9b8de}
  /* 내 프로필 카드 */
  .pc{position:relative;overflow:hidden;box-sizing:border-box;height:160px;flex:none;border-radius:20px;background:#0d1433;border:1px solid #2a3556}
  #pvBanner{position:absolute;left:0;top:0;right:0;height:76px;background:#123;transition:background .3s}
  #pvBanner::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 2px,transparent 2px 16px)}
  #pvBanner::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(180deg,transparent,rgba(13,20,51,.9))}
  .pc .ptag{position:absolute;left:14px;right:14px;top:10px;display:flex;align-items:center;gap:8px}
  .pc .pp{font-weight:700;font-size:13px;color:#fff;padding:2px 9px;border-radius:8px;border:1px solid #fff;background:rgba(6,10,30,.45)}
  .pc .me{margin-left:auto;font-size:13px;font-weight:900;color:#04061a;background:#5dffb0;padding:2px 11px;border-radius:999px}
  .pc .blob{position:absolute;right:-30px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:#3d8bff;opacity:.2;filter:blur(40px)}
  .pc canvas{position:absolute;right:6px;bottom:4px}
  .pvrow{position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:12px}
  #pvIcon{flex:none;width:62px;height:62px;border-radius:20px;border:3px solid #0d1433;background:#101a40;font-size:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #5dffb0}
  #pvName{display:block;font-size:24px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  #pvBn{font-size:12px;color:#a9b8de}
  /* 꾸미기: 대기실의 '내 탱크' · '맵' 패널처럼 눌러서 고르는 버튼 */
  #home .nick{display:flex;gap:8px}
  #home .nick input{height:46px;padding:0 14px;font-size:17px;border-radius:12px}
  #home .nick button{flex:none;width:46px;height:46px;border-radius:12px;border:2px solid #2a3556;background:#0d1433;font-size:22px}
  #home .pick{display:grid;gap:8px}
  #avs{grid-template-columns:repeat(6,minmax(0,1fr))}
  #avs button{height:46px;border-radius:12px;border:2px solid #2a3556;background:#0d1433;font-size:24px;display:flex;align-items:center;justify-content:center}
  #avs button.on{border-color:#5dffb0;background:rgba(93,255,176,.12);box-shadow:0 0 12px rgba(93,255,176,.3)}
  #bns{grid-template-columns:repeat(4,minmax(0,1fr))}
  #bns button{height:36px;border-radius:10px;border:2px solid transparent;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  #bns button.on{border-color:#ffe94a;box-shadow:0 0 12px rgba(255,233,74,.4)}
  /* 하단 바: 상태 + 방 만들기(대기실 '게임 시작' 버튼 모양) */
  #create{height:64px;padding:0 56px 0 44px;display:flex;align-items:center;gap:14px;border-radius:20px;background:linear-gradient(180deg,#7dffc4,#2fd48b);color:#04210f;font-size:24px;font-weight:900;letter-spacing:.06em;box-shadow:0 8px 30px rgba(93,255,176,.35),inset 0 1px 0 rgba(255,255,255,.7)}
  #create:active,#join:active{transform:scale(.98)}
  #home #conn{margin:0;font-size:17px;color:#cfd9f5}
  #home #msg{color:#ffcc66;font-size:16px;font-weight:700}
  /* ---------- 대기실: 1280×720 무대를 화면 크기에 맞춰 키워요 ---------- */
  #room{position:fixed;inset:0;background:#060a1e;overflow:hidden}
  #room[hidden]{display:none}
  #lobby{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;box-sizing:border-box;padding:28px;display:flex;flex-direction:column;gap:20px;
    background:radial-gradient(900px 500px at 15% -10%,#16205a 0%,rgba(22,32,90,0) 70%),radial-gradient(700px 500px at 100% 100%,#2a1050 0%,rgba(42,16,80,0) 70%),#060a1e;
    color:#eaf0ff;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;overflow:hidden}
  :where(#lobby) button{font:inherit;padding:0;border:0;border-radius:0;background:none;color:inherit;white-space:normal;cursor:pointer}
  :where(#lobby) button:disabled{cursor:not-allowed}
  #lobby .cp{font-family:'Chakra Petch','Noto Sans KR',sans-serif}
  #lobby .bar{width:4px;height:18px;border-radius:2px;flex:none}
  #lobby .sec{font-size:20px;font-weight:900}
  #lobby .ro{pointer-events:none}
  #lobby .tk{box-sizing:border-box;height:84px;padding:6px 4px 8px;border-radius:14px;border:2px solid #2a3556;background:#0d1433;color:#eaf0ff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
  #lobby .mp{box-sizing:border-box;padding:4px 4px 8px;border-radius:14px;border:2px solid #2a3556;background:#0d1433;color:#eaf0ff;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
  #lobby .mp canvas{display:block;width:100%;height:auto;border-radius:9px}
  #start{height:64px;padding:0 56px 0 44px;display:flex;align-items:center;gap:14px;border-radius:20px;background:linear-gradient(180deg,#7dffc4,#2fd48b);color:#04210f;font-size:24px;font-weight:900;letter-spacing:.06em;box-shadow:0 8px 30px rgba(93,255,176,.35),inset 0 1px 0 rgba(255,255,255,.7)}
  #start:disabled{opacity:.4;filter:grayscale(.8);box-shadow:none}
  #start[hidden],#vs[hidden]{display:none !important}
  /* ---------- 게임 화면 (항상 가로) ---------- */
  #game{position:fixed;inset:0;background:#05060f;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;--ch:100vh}
  /* 전체화면/방향 잠금이 안 되는 터치 기기(iOS 등)에서 세로로 들고 있으면 화면을 90° 돌려서 가로로 보여줘요 */
  #game.force-land{inset:auto;top:0;left:0;width:var(--sh);height:var(--sw);transform-origin:0 0;transform:translateX(var(--sw)) rotate(90deg)}
  #c{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #info{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#050a08ee;border:1px solid #00bf63;box-shadow:0 0 10px #00bf6366,0 3px 10px #0008;color:#fff;padding:6px 16px;border-radius:14px;font-size:15px;font-weight:bold;white-space:nowrap;z-index:5}

  #wind{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#050a08ee;border:1px solid #00bf63;box-shadow:0 0 8px #00bf6355;color:#d8ffe9;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:bold;white-space:nowrap;z-index:5;pointer-events:none}

  /* 컨트롤 크기는 화면 높이에 맞춰 자동 조절 */
  #game{--g:#00bf63;--gl:#4dffa8;--bk:#050a08}
  .pad,#fire,#charge,#fuel,#rd,#pw{--s:clamp(96px,calc(var(--ch) * .36),150px);--hh:clamp(66px,calc(var(--ch) * .22),96px);--mw:calc(var(--hh) * 2.3);--aw:calc(var(--s) * 1.15);--fw:calc(var(--s) * .74);--m:max(14px,env(safe-area-inset-left,0px));--b:max(14px,env(safe-area-inset-bottom,0px));--bw:6px}

  /* ---------- 조이스틱: 유리(글래스) 패널 + 민트 포인트 ---------- */
  #game{--ac:#5dffb0;--ac2:#b9ffdf;--neon:#4dd2ff;--glass:rgba(12,20,17,.62);--line:rgba(255,255,255,.16)}
  .glass{position:absolute;inset:0;pointer-events:none;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03) 45%,rgba(0,0,0,.16)),var(--glass);
    border:1px solid rgba(77,210,255,.42);
    box-shadow:0 10px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -10px 18px rgba(0,0,0,.18),inset 0 0 12px rgba(77,210,255,.1);
    transition:box-shadow .18s,border-color .18s}
  .glass::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;   /* 바깥으로 번지는 하늘색 네온: 투명도만 천천히 숨 쉬어요 */
    box-shadow:0 0 0 1px rgba(77,210,255,.3),0 0 10px rgba(77,210,255,.4),0 0 26px rgba(77,210,255,.2);
    opacity:.8;transition:opacity .18s}
  .pad.on .glass,#pw.on .glass{border-color:rgba(130,225,255,.8);
    box-shadow:0 10px 26px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 16px rgba(77,210,255,.2)}
  .pad.on .glass::after,#pw.on .glass::after{opacity:1;animation:none;
    box-shadow:0 0 0 1px rgba(130,225,255,.55),0 0 16px rgba(77,210,255,.65),0 0 40px rgba(77,210,255,.35)}
  @keyframes neonb{0%,100%{opacity:.6}50%{opacity:1}}
  #am .glass{inset:0 6.7%}   /* 조준: 높이만큼의 정원 (폭 × √3/2) */
  #mv .glass::before{content:"";position:absolute;left:22%;right:22%;top:50%;border-top:2px dotted rgba(255,255,255,.14)}

  .pad{position:absolute;bottom:var(--b);touch-action:none;z-index:5}
  .pad::after,#pw::after{content:attr(data-l);position:absolute;top:-27px;left:50%;transform:translateX(-50%);padding:3px 12px;border-radius:999px;
    background:var(--glass);border:1px solid rgba(77,210,255,.32);box-shadow:0 0 10px rgba(77,210,255,.18);
    color:#e9fff4;font-size:11px;font-weight:600;letter-spacing:.14em;white-space:nowrap;pointer-events:none}
  #mv{left:var(--m);width:var(--mw);height:var(--hh);--k:calc(var(--hh) * .62)}
  #am{right:var(--m);width:var(--aw);height:calc(var(--aw) * .866);--k:calc(var(--aw) * .2)}  /* 정육각형 비율 그대로: 높이 = 폭 × √3/2 */
  #am::after{top:auto;bottom:12%;padding:0;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-size:10px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.32em}

  /* 연료: 이동 패널 아래쪽의 가는 게이지 (노브가 움직이는 범위와 같은 길이) */
  .fuelsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 4px rgba(93,255,176,.45))}
  .fuelsvg .ftrack{fill:none;stroke:rgba(255,255,255,.14);stroke-width:4;stroke-linecap:round}
  .fuelsvg #fuelf{fill:none;stroke-width:4;stroke-linecap:round;transition:opacity .15s}
  .fuelsvg.low #fuelf{stroke:#ff5a3c}
  .fuelsvg.low{filter:drop-shadow(0 0 5px rgba(255,90,60,.7))}

  /* 이동: 얇은 화살표 + 좌우로 미끄러지는 노브 */
  .ar{position:absolute;top:50%;width:calc(var(--hh) * .13);height:calc(var(--hh) * .13);margin-top:calc(var(--hh) * -.065);
    border:solid rgba(255,255,255,.5);border-width:0 0 2.5px 2.5px;pointer-events:none}
  .ar.l{left:12%;transform:rotate(45deg)}
  .ar.r{right:12%;transform:rotate(-135deg)}
  .knob{position:absolute;left:50%;top:50%;width:var(--k);height:var(--k);margin:calc(var(--k) / -2);border-radius:50%;pointer-events:none;
    background:linear-gradient(150deg,#fff,#dbe6e0 55%,#aebdb6);
    box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.14),inset 0 1px 0 #fff;
    transition:box-shadow .18s}
  .knob::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
  .knob.snap{transition:transform .16s ease-out,box-shadow .18s}
  .pad.on .knob{box-shadow:0 6px 16px rgba(0,0,0,.5),0 0 0 5px rgba(93,255,176,.22),0 0 22px rgba(93,255,176,.5),inset 0 1px 0 #fff}

  /* 조준: 눈금 다이얼 + 중심에서 노브까지 이어지는 빛줄기 */
  .arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .arc .orbit{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.1}
  .arc .ticks{fill:none;stroke:rgba(255,255,255,.38);stroke-width:.9;stroke-linecap:round}
  .arc .dot{fill:rgba(255,255,255,.55)}
  .beam{position:absolute;left:50%;top:50%;height:2px;margin-top:-1px;width:0;transform-origin:0 50%;border-radius:2px;pointer-events:none;
    background:linear-gradient(90deg,rgba(93,255,176,0),rgba(93,255,176,.95));box-shadow:0 0 8px rgba(93,255,176,.6)}
  #am .knob{background:linear-gradient(150deg,#e9fff4,var(--ac) 55%,#1fbf7d);box-shadow:0 6px 14px rgba(0,0,0,.5),0 0 14px rgba(93,255,176,.45),inset 0 1px 0 rgba(255,255,255,.8)}
  #am .knob::after{background:#fff;box-shadow:none}

function canAct() {

// 화면 방향/크기에 맞춰 레이아웃 갱신: 터치 기기에서 세로면 게임 화면을 돌려서 가로로 보여줘요

  g.style.setProperty('--sh', h + 'px');
  g.style.setProperty('--ch', (rot ? w : h) + 'px');

// ---------- 조이스틱 (이동 / 조준 분리) ----------

    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if ($('game').classList.contains('force-land')) [dx, dy] = [dy, -dx]; // 90° 회전 보정

(function () {

function sawP(g, cx, cy, r, n, rot, d) {   // 원형 톱날 윤곽: 완만하게 솟았다가 뚝 떨어지는 갈고리 이빨 n개 (시계 방향으로 돌 때 이빨이 앞을 향해요)
  g.beginPath();
  const st = 2 * Math.PI / n, P = (a, q) => [cx + Math.cos(a) * q, cy + Math.sin(a) * q];
  for (let k = 0; k < n; k++) {
    const a0 = rot + k * st, v = P(a0, r), c1 = P(a0 + st * .3, r + d * .1), tip = P(a0 + st * .88, r + d), nx = P(a0 + st, r);
    if (k === 0) g.moveTo(v[0], v[1]);
    g.quadraticCurveTo(c1[0], c1[1], tip[0], tip[1]); g.lineTo(nx[0], nx[1]);
  }
  g.closePath();
}
function gearP(g, cx, cy, r, n, rot, d) {   // 톱니바퀴 윤곽 경로: 반지름 r, 이빨 n개, 이빨 높이 d (탱크 장식과 땅 위 톱니바퀴가 같이 써요)
  g.beginPath();
  const w = Math.PI / n;
  for (let k = 0; k < n; k++) {
    const a0 = rot + k * 2 * w;
    [[a0 - w * .55, r], [a0 - w * .3, r + d], [a0 + w * .3, r + d], [a0 + w * .55, r]].forEach(([a, q], j) => { const x = cx + Math.cos(a) * q, y = cy + Math.sin(a) * q; (k === 0 && j === 0) ? g.moveTo(x, y) : g.lineTo(x, y); });
  }
  g.closePath();
}

// o: { col, lite, edge, dir(±1), a(조준 라디안), tilt, now, i }
function paintTank(kind, o) {
  o.k = TK[kind]; o.tp = TPK[kind];
  C.save(); C.rotate(o.tilt); C.lineJoin = 'round'; C.lineCap = 'round';
  C.save(); C.translate(8 * o.dir, -19.5); C.rotate(-o.a - o.tilt); if (o.dir < 0) C.scale(1, -1); BARREL[kind](o); C.restore();   // 포신 (왼쪽을 볼 땐 위아래를 다시 뒤집어 장식이 위에 오게)
  C.save(); C.scale(o.dir, 1); BODY[kind](o); C.restore();
  C.restore();
}

function drawTank(p, i, deg, active) {
  const kind = TK[p.tank] ? p.tank : 'basic', k = TK[kind];
  const col = pc(i), a = deg * Math.PI / 180, dir = deg <= 90 ? 1 : -1, T = st.terrain, now = performance.now();
  const x0 = Math.max(0, Math.round(p.x - 14 * TS)), x1 = Math.min(W - 1, Math.round(p.x + 14 * TS));
  const tilt = Math.max(-0.5, Math.min(0.5, Math.atan2(T[x1] - T[x0], x1 - x0)));
  C = ctx;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(TS, TS);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.scale(1, .26);   // 발밑 네온 빛
  const ug = ctx.createRadialGradient(0, 0, 0, 0, 0, 40); ug.addColorStop(0, rgba(col, .6)); ug.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = ug; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill();
  if (kind === 'incendiary' || kind === 'laser' || kind === 'rail' || kind === 'gravity' || kind === 'electro') {   // 종류 색이 살짝 섞인 두 번째 빛
    const u2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 30); u2.addColorStop(0, rgba(k.acc, .3)); u2.addColorStop(1, rgba(k.acc, 0));
    ctx.fillStyle = u2; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.fill();
  }
  if (active) { ctx.strokeStyle = rgba(col, .9); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 32 + 5 * Math.sin(now / 240), 0, 7); ctx.stroke(); }   // 내 차례 링
  ctx.restore();
  paintTank(kind, { col, lite: shade(col, .6), edge: shade(col, .35), dir, a, tilt, now, i, charge: p.charge || 0 });
  ctx.restore();

  if (p.hp <= 35) {   // 다치면 연기, 많이 다치면 불꽃
    const t = now / 600;
